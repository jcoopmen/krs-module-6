{sec:4, type:'section', kicker:'Activity', art:'c', tone:'tranquil',
 title:`Reflect and revise`, line:`Offer a reflection to Walter and Dominique, then adjust it when each of them responds.`},

{sec:4, type:'prose', title:'How this activity works', blocks:[
  {p:`Now that you have practised choosing the right words, let's turn to offering a reflection and adjusting it according to a caller or texter's response.`, lede:true},
  {p:`In this activity, you will return to two callers you met earlier in the course. Each conversation has two decision points so you can practise both your initial reflection and how you adjust it.`},
  {p:`At each decision point, you will:`},
  {ul:[
    `listen to what the caller says`,
    `select the response you would offer`,
    `notice how the caller reacts`
  ]},
  {note:`This activity is not scored. After each choice, you can explore the other options and compare the caller's reactions. In every 9-8-8 interaction, the responder asks about suicide early in the conversation. That part of these calls is not included in this activity.`}
]},

/* The feedback is held behind a button so the caller's reaction lands first
   (Module 5 convention for these decision points). */
{sec:5, type:'respond', title:'Conversation 1 (Walter, he/him)', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`Walter, whom you met in Module 1, calls 9-8-8 on a Sunday evening. He usually speaks with his daughter, who lives out west, on Sundays. A few minutes into the interaction, he describes their conversation that afternoon.`, lede:true},
  {h3:`Decision point 1`},
  {audio:{label:`Walter's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(unhurried)`, t:`I talked to my daughter this afternoon. We always talk on Sundays. Well, today, she had the kids in the car and the phone kept cutting out, so it was short. <span class="meta">(pause)</span> I said, that's fine, you can go. And so she went. <span class="meta">(a small laugh)</span> But then I sat there with the phone in my hand like a fool.`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`"It sounds like you felt lonely after you hung up. Is that close?"`,
   reply:[
    {spk:'Caller', t:`Lonely... I suppose. <span class="meta">(pause)</span> It's more that I didn't want to be a bother. She's got the kids, her job. I'm one more thing on the list.`}
   ]},
  {k:'B', t:`"That sounds really hard, Walter. It's never easy when a call with family gets cut short like that."`,
   reply:[
    {spk:'Caller', meta:`(politely)`, t:`Oh, it's nothing, really. She's busy. <span class="meta">(pause)</span> What was I saying? Oh, the garden. I was going to tell you about the garden.`}
   ]},
  {k:'C', t:`"You're hurt that she didn't make time for you today, when Sundays are supposed to be your time together."`,
   reply:[
    {spk:'Caller', meta:`(a little stiff)`, t:`No, no. She did make time. It's not her fault, with the kids in the car. I wouldn't want you to think that of her.`}
   ]}
 ],
 closingBlocks:[
  {p:`Walter describes sitting with the phone after the call ends and calls himself "a fool." These details give you a starting point for exploring how he felt, although his feelings are not yet clear.`},
  {p:`<strong>Response A</strong> offers a possible feeling and invites Walter to check it. He partly accepts "lonely," then explains his concern about being a bother. His clarification gives you a more specific understanding to work with.`},
  {p:`<strong>Response B</strong> acknowledges difficulty in general terms. It says little about Walter's particular experience. In this example, he minimizes what happened and changes the subject, leaving his feelings unexplored.`},
  {p:`<strong>Response C</strong> adds an interpretation of his daughter's behaviour. Walter said the call was short and the connection was poor. Saying she "didn't make time" introduces blame and presents his feelings as certain. His next response focuses on defending her.`}
 ]},

{sec:5, type:'respond', title:'Decision point 2', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {audio:{label:`Walter's call`, ch:'Voice call', lines:[
    {spk:'Caller', t:`Lonely... I suppose. <span class="meta">(pause)</span> It's more that I didn't want to be a bother. She's got the kids, her job. I'm one more thing on the list.`}
  ]}}
 ],
 prompt:`How do you adjust your reflection?`,
 options:[
  {k:'A', t:`"You felt like one more thing on her list, and you didn't want to add to everything she's already managing. Am I understanding you?"`,
   reply:[
    {spk:'Caller', meta:`(quietly)`, t:`That's it. <span class="meta">(pause)</span> That's exactly it. I'd never say that to her.`}
   ]},
  {k:'B', t:`"I still hear a lot of loneliness in that, Walter. The house must feel very quiet once the phone goes down on a Sunday afternoon."`,
   reply:[
    {spk:'Caller', meta:`(flatter)`, t:`Yes. Well. It is quiet. <span class="meta">(pause)</span> Anyway.`}
   ]},
  {k:'C', t:`"I'm sorry, I didn't mean to put words in your mouth. What else did you and your daughter manage to talk about before the call ended?"`,
   reply:[
    {spk:'Caller', t:`Oh, don't apologize. <span class="meta">(pause)</span> The usual, I suppose. School, the weather out there. Not much.`}
   ]}
 ],
 closingBlocks:[
  {p:`In this excerpt, Walter has clarified what matters most to him: his concern about being a bother. Your next response can show that you have taken in that clarification.`},
  {p:`<strong>Response A</strong> adjusts the reflection to include what Walter has explained. It acknowledges his sense of being another demand on his daughter without suggesting that she sees him that way. As a result, Walter confirms the reflection and shares that he would not tell her how he feels.`},
  {p:`<strong>Response B</strong> doubles down on the original interpretation. Loneliness may still be part of Walter's experience, but he has directed your attention to something more specific. Here, his brief agreement about the quiet house is followed by an attempt to change the subject.`},
  {p:`<strong>Response C</strong> apologizes, then moves away from the feeling. A brief apology can be appropriate, but the question turns to the details of the family conversation. Walter first reassures the responder, then answers without exploring what he has just shared.`}
 ]},

{sec:6, type:'respond', title:'Conversation 2 (Dominique, she/her)', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`In this conversation, you are continuing the call with Dominique from Modules 4 and 5. Earlier, she asked to keep talking rather than discuss her benefits review meeting. A few minutes later, she returns to the meeting herself.`, lede:true},
  {h3:`Decision point 1`},
  {audio:{label:`Dominique's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(tired)`, t:`I keep picturing it. Walking into that room and them looking at me like I'm trying to get away with something. <span class="meta">(pause)</span> I've been picturing it for weeks.`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`"That sounds like a really stressful thing to have on your mind every day for weeks."`,
   reply:[
    {spk:'Caller', meta:`(flat)`, t:`Yes. It's stressful. <span class="meta">(pause)</span> Everything's stressful.`}
   ]},
  {k:'B', t:`"It sounds like you're dreading the meeting, and maybe frightened of how they'll look at you. Is that right?"`,
   reply:[
    {spk:'Caller', meta:`(sharper)`, t:`It's not... No. It's not fear. Or, fine, maybe some of it is. But honestly? Mostly I'm angry. I'm just so angry that I have to prove something that's true.`}
   ]},
  {k:'C', t:`"You're terrified of walking into that room. Weeks of picturing it has worn you right down."`,
   reply:[
    {spk:'Caller', meta:`(pause)`, t:`Yeah. Terrified. <span class="meta">(quieter)</span> I guess that's it.`}
   ]}
 ],
 closingBlocks:[
  {p:`Dominique describes repeatedly imagining the meeting and anticipating that others will doubt her. She has not yet named how she feels about it.`},
  {p:`<strong>Response A</strong> acknowledges ongoing stress but leaves the specific feeling unexplored. Although it recognizes how long the meeting has been on her mind, "stressful" is too broad. Dominique agrees without telling you more about this particular experience.`},
  {p:`<strong>Response B</strong> offers a tentative interpretation and invites correction. In response, Dominique explains that fear is only part of what she feels. Anger is more prominent, especially about having to prove something she knows to be true. Her correction gives you a clearer understanding to respond to.`},
  {p:`<strong>Response C</strong> names an intense feeling with certainty. "Terrified" goes beyond what Dominique has expressed. Her hesitant agreement gives you limited information about how well the word fits. It would be important to leave room for her to clarify rather than treating the feeling as settled.`}
 ]},

{sec:6, type:'respond', title:'Decision point 2', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {audio:{label:`Dominique's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(sharper)`, t:`It's not... No. It's not fear. Or, fine, maybe some of it is. But honestly? Mostly I'm angry. I'm just so angry that I have to prove something that's true.`}
  ]}}
 ],
 prompt:`How do you adjust your reflection?`,
 options:[
  {k:'A', t:`"I hear the anger. And I think underneath it there's still a lot of fear about what happens if they say no again."`,
   reply:[
    {spk:'Caller', meta:`(flat)`, t:`Sure. If you say so.`}
   ]},
  {k:'B', t:`"Of course you're angry. Anyone would be furious with a system that treats people this way. It's completely unfair to you."`,
   reply:[
    {spk:'Caller', meta:`(pause)`, t:`I guess. <span class="meta">(slower)</span> I don't know about anyone else. I just know I'm tired.`}
   ]},
  {k:'C', t:`"Okay, so, angry. You're angry that you're being made to prove something that's already true. That fits better than frightened. Thank you for telling me."`,
   reply:[
    {spk:'Caller', meta:`(a long breath)`, t:`Yes. <span class="meta">(pause)</span> Nobody lets me be angry about it. Everyone wants me calm and reasonable. <span class="meta">(quieter)</span> I'm tired of being reasonable.`}
   ]}
 ],
 closingBlocks:[
  {p:`Dominique has acknowledged some fear and made clear that anger is the feeling she most wants you to understand.`},
  {p:`<strong>Response A</strong> gives priority to the responder's interpretation. It briefly acknowledges anger, then returns to fear as the underlying feeling. This repeats the error identified by lived-experience advisors: holding on to an interpretation after the person has corrected it. Dominique's "If you say so" suggests resignation rather than confirmation.`},
  {p:`<strong>Response B</strong> recognizes anger but adds intensity and judgement. "Furious" is stronger than the word Dominique chose, while "anyone" shifts attention away from her particular experience. The responder's opinion about the system takes up more of the response, and Dominique returns to describing her exhaustion.`},
  {p:`<strong>Response C</strong> accepts the correction and reflects what Dominique has said. It uses her word, connects it to having to prove something true and briefly acknowledges what the responder missed. Dominique confirms the reflection and explains how other people's responses to her anger have affected her.`}
 ]},

{sec:6, type:'prose', title:'Activity debrief', blocks:[
  {p:`In both conversations, the tentative reflection only partly captured the caller's experience. Walter clarified his concern about being a bother. Dominique explained that anger was more prominent than fear.`, lede:true},
  {p:`The main takeaway from this activity is that:`},
  {key:[`An effective reflection develops through listening, checking and adjusting.`]},
  {tip:{p:`Give the person room to confirm or correct your understanding, then use what they tell you in your next response. This allows the reflection to become more accurate and the person to describe more of what matters to them.`}}
]},

/* ---------------- TOPIC 2 ---------------- */
{sec:7, type:'section', num:'02', kicker:'Topic 2', art:'d',
 title:`Knowing when to ask instead`, line:`How to recognize repetitive or generic reflections and decide when to ask about feelings`},

{sec:7, type:'prose', blocks:[
  {p:`In the previous topic, you practised offering an emotion reflection and adjusting it based on the person's response. While reflecting emotions can be a powerful skill, it may not always be the best response. In your work as a responder, it is also important to recognize when another reflection would add little to the interaction.`, lede:true},
  {p:`This topic explores two patterns that can make reflections less helpful:`},
  {ul:[
    `Reflecting too often`,
    `Relying on general statements`
  ]},
  {p:`You will also consider when an open question gives the person more room to describe their feelings.`},
  {panel:{cls:'blue', p:`In Module 7, you will practise making these choices in context through a pair of simulated interactions.`}}
]},

{sec:7, type:'prose', title:'Reflecting too often', blocks:[
  {p:`<strong>Over-reflecting</strong> means responding to almost every statement by naming a feeling. Although each of your reflections may be accurate, when experienced together they can make the interaction feel formulaic, like a checklist or textbook. As a result, the caller or texter may begin to feel managed, slow down, or share less detail.`, lede:true},
  {p:`Once a person has confirmed a feeling, consider what their next words call for. They may need time to say more, or a question may help you understand something they have not yet explained. In these situations, another reflection may be counter-productive.`}
]},

{sec:7, type:'prose', title:'Relying on general statements', blocks:[
  {p:`<strong>Generic statements</strong> acknowledge distress in terms that could apply to many people and situations. Examples include:`, lede:true},
  {carousel:{label:`Examples of generic statements`, quote:true, items:[
    `"That sounds really hard."`,
    `"I'm so sorry you're going through this."`,
    `"That must be so difficult for you."`
  ]}},
  {p:`These statements can convey care, and there may be appropriate times to use them in an interaction. Used repeatedly, however, they give the person little indication of what you understand about their particular experience, and they may begin to sound inauthentic to the caller or texter.`},
  {panel:{cls:'blue', p:`<strong>Remember:</strong> Research on written crisis conversations illustrates why frequency alone is not a useful measure of reflection. In one study, less successful conversations contained more statements about the person's emotions. The researchers suggested that specific, tailored responses may reduce the need for repeated statements.`}}
]},

{sec:7, type:'prose', title:'Asking about feelings instead', blocks:[
  {p:`If you notice that your reflections are becoming repetitive or too general, you should consider whether asking a question instead would help the person say more about what they are feeling.`, lede:true},
  {p:`An <strong>open question</strong> gives the caller or texter room to describe their feelings in their own words. It can help when you are unsure what to reflect or when the person is still working out how they feel.`}
]},

/* Continues "Asking about feelings instead". */
{sec:7, type:'prose', blocks:[
  {p:`Consider an open question when:`, lede:true},
  {ul:[
    `Several feelings seem to be present, and you are unsure which matters most to the person`,
    `They use a word such as "fine" or "done," and its meaning is unclear`,
    `You have already offered reflections, and another would add little`,
    `They seem to be discovering or sorting through their feelings as they talk`
  ]},
  {p:`In these situations, here are some examples of questions you could ask:`},
  {carousel:{label:`Examples of open questions about feelings`, quote:true, items:[
    `"How did that leave you feeling?"`,
    `"What was that like for you?"`,
    `"What's the hardest part of this for you right now?"`,
    `"When you say 'done,' what does that mean for you?"`
  ]}}
]},

/* Continues "Asking about feelings instead". */
{sec:7, type:'prose', blocks:[
  {p:`The questioning skills from Module 5 also apply here:`, lede:true},
  {cards:{cols:3, tight:true, items:[
    {t:`Ask one question at a time`},
    {t:`Avoid "why" questions that could sound accusatory`},
    {t:`Give the person time to answer`}
  ]}},
  {tip:{p:`Let the caller or texter's response to your questions guide what comes next. If you reflect a feeling they have named, you should use their words and check any meaning you are unsure about.`}}
]},

/* ---------------- ACTIVITY: REFLECT AND REVISE, PART 2 ---------------- */
{sec:8, type:'section', kicker:'Activity', art:'e', tone:'tranquil',
 title:`Reflect and revise, part 2`, line:`Decide when to ask about Maya's feelings and when to reflect what she has shared.`},

{sec:8, type:'prose', title:'How this activity works', blocks:[
  {p:`Now let's practise deciding when to ask about a texter's feelings and when to reflect what they have shared.`, lede:true},
  {p:`In this activity, you will review an interaction that has two decision points. At each one, you will:`},
  {ul:[
    `read the texter's messages`,
    `select the responses you would send`,
    `notice how the texter reacts`
  ]},
  {note:`This activity is not scored. After each choice, you can explore the other options and compare the texter's reactions.`}
]},

/* No delay here can be shown as a timestamp: in option C nothing arrives
   after the minute passes, so it stays a stage direction. */
{sec:9, type:'respond', title:'Conversation 3 (Maya, she/her)', ch:'Text',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`You are continuing the text interaction with Maya from Module 5. She has just told you that she stood outside her roommate's door tonight but did not knock.`, lede:true},
  {h3:`Decision point 1`},
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`I keep doing that. I get so close to doing something and then I back out because what if I make it worse`},
    {who:'them', spk:'Texter', t:`I don't even know what I'm so worried about honestly`},
    {sys:`The typing indicator appears, then stops.`, typing:true}
  ]}}
 ],
 prompt:`What would you send?`,
 options:[
  {k:'A', t:`"It sounds like you feel guilty for not knocking on her door tonight, Maya. Does that fit for you?"`,
   reply:[
    {spk:'Texter', t:`I mean, maybe? I don't know if guilty is quite it.`},
    {spk:'Texter', t:`Sorry, I'm not explaining this well.`}
   ]},
  {k:'B', t:`"You get close to knocking, then something makes you stop. What's that moment like for you?"`,
   reply:[
    {spk:'Texter', t:`Scary, I think. But not scared of her. Scared of finding out it's worse than I think it is.`},
    {spk:'Texter', t:`Like if I knock and she doesn't answer, then I'll know. That's the part I can't bring myself to do.`}
   ]},
  {k:'C', t:`"That sounds really hard, Maya. You've been dealing with so much on your own, and for a long time now."`,
   reply:[
    {spk:'Texter', t:`Yeah.`},
    {spk:'Texter', t:`Thanks.`},
    {sys:`A minute passes, and nothing more arrives.`}
   ]}
 ],
 closingBlocks:[
  {p:`Maya says she does not know what she is feeling. Her messages give you an opportunity to help her explore the experience before offering a word to describe her feelings.`},
  {p:`<strong>Response A</strong> is tentative, but there is not much evidence in what Maya said to reach the conclusion of "guilty" so soon. She has described anticipating that something could get worse. The reflection introduces a different interpretation, and Maya responds by questioning how well she has explained herself.`},
  {p:`<strong>Response B</strong> stays with the moment Maya described and asks about her experience. She identifies fear and explains what feels frightening: the possibility that her roommate's response will confirm her concerns.`},
  {p:`<strong>Response C</strong> conveys care in broad, generic terms. It acknowledges that Maya is having a difficult time but does little to explore what happens when she reaches the door. In this example, she gives a brief acknowledgement and shares nothing further.`}
 ]},

{sec:9, type:'respond', title:'Decision point 2', ch:'Text',
 feedbackCta:`Show the feedback`,
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`Scary, I think. But not scared of her. Scared of finding out it's worse than I think it is.`},
    {who:'them', spk:'Texter', t:`Like if I knock and she doesn't answer, then I'll know. That's the part I can't bring myself to do.`}
  ]}}
 ],
 prompt:`What would you send?`,
 options:[
  {k:'A', t:`"It's completely normal to feel scared in a situation like this, Maya. Anyone in your position would be feeling the same way."`,
   reply:[
    {spk:'Texter', t:`I guess.`},
    {spk:'Texter', t:`It doesn't really feel normal.`}
   ]},
  {k:'B', t:`"What do you think would happen if she did answer the door tonight? Have you pictured that part of it?"`,
   reply:[
    {spk:'Texter', t:`I don't know. I haven't really thought about that.`},
    {spk:'Texter', t:`Probably nothing good.`}
   ]},
  {k:'C', t:`"So, it feels scary because, if she doesn't answer, that might confirm what you're worried about. Have I understood that right?"`,
   reply:[
    {spk:'Texter', t:`Yes. Exactly that.`},
    {spk:'Texter', t:`I've never said that out loud.`}
   ]}
 ],
 closingBlocks:[
  {p:`Maya has now named a feeling and explained what it means to her. You have enough information to offer a specific reflection.`},
  {p:`<strong>Response A</strong> moves quickly to reassurance. Calling the feeling "completely normal" and saying "anyone" would feel it overlooks the particular fear Maya has described. She responds to the claim about normality instead of saying more about her experience.`},
  {p:`<strong>Response B</strong> shifts to a different possibility. Exploring what might happen if her roommate answers could be useful later. Here, the question moves away from Maya's newly expressed fear before acknowledging it.`},
  {p:`<strong>Response C</strong> reflects the feeling and the concern connected to it. It stays close to Maya's explanation and checks the responder's understanding. Maya confirms the reflection and recognizes that she has put something into words for the first time.`}
 ]},

{sec:9, type:'prose', title:'Activity debrief', blocks:[
  {p:`In this activity, you saw that the most useful response changed as Maya shared more:`, lede:true},
  {ul:[
    `<strong>When her feelings were unclear</strong>, an open question helped her describe the experience and find her own word.`,
    `<strong>Once she had explained the fear</strong>, a specific reflection helped check and communicate the responder's understanding.`
  ]},
  {tip:{p:`A question can help you understand something that is unclear. A reflection can acknowledge and check what you have learned. Using both responsively gives the person room to describe their experience at their own pace.`}}
]},

/* ---------------- TOPIC 3 ---------------- */
{sec:10, type:'section', num:'03', kicker:'Topic 3', art:'e',
 title:`The six levels of validation`, line:`How to recognize each level and use the highest level you can offer sincerely based on what the person has shared`},

{sec:10, type:'prose', blocks:[
  {p:`In Topics 1 and 2, you practised recognizing feelings, reflecting them accurately and adjusting your understanding. These skills also help you validate a caller or texter's experience.`, lede:true},
  {p:`<strong>Validation</strong> is one of the core elements of every 9-8-8 interaction:`},
  {cards:{cols:5, tight:true, num:true, items:[
    {t:`Engage`}, {t:`Listen`}, {t:`Reflect`}, {t:`Validate`}, {t:`Collaborate`}
  ]}},
  {p:`This topic introduces the six levels of validation described by Marsha Linehan, which are also used in the 9-8-8 Intervention Manual. You will learn where reflection fits and how to choose a validating response based on what you understand about the person.`},
  {panel:{cls:'blue', p:`In Module 7, you will practise making these choices throughout a pair of simulated interactions.`}}
]},

{sec:10, type:'prose', title:'What validation is', blocks:[
  {p:`<strong>Validation</strong> means acknowledging that a person's experience is legitimate and that their feelings and reactions are understandable in context.`, lede:true},
  {p:`The 9-8-8 Intervention Manual describes validation as a communication technique for demonstrating and developing empathy, understanding and acceptance towards a person's experiences, thoughts, feelings and behaviours. It involves:`},
  {ul:[
    `listening without judgement or criticism`,
    `acknowledging the person's experience without trying to change their perspective`
  ]},
  {p:`Validation does not mean that you agree with the person's perspective, thoughts or behaviours. You can recognize how someone's feelings and reactions make sense given their circumstances and history without agreeing with their conclusions or endorsing their actions. Topic 4 explores this distinction in more detail.`},
  {tip:{p:`Validate what you can sincerely understand about the person's experience, while maintaining clear limits around harm.`}}
]},

{sec:10, type:'prose', title:'Validation in practice', blocks:[
  {p:`The Canadian Crisis Line Response Competency Framework identifies three practices for how to use validation in your interactions:`, lede:true},
  {instr:`Select each practice to learn more.`},
  {reveal:{items:[
    {t:`Acknowledge suffering and distress`, d:`Recognize the difficulty the caller or texter is experiencing.`},
    {t:`Acknowledge what makes sense in context`, d:`Identify what is understandable about their feelings, thoughts or behaviours without affirming or reinforcing self-harm or suicide.`},
    {t:`Reflect accurately`, d:`Put the emotions and thoughts they have expressed into words that fit their experience.`}
  ]}},
  {p:`No matter what a caller or texter is expressing, there is almost always something genuine you can validate.`},
  {tip:{p:`Even when you find an interaction difficult or are unsure how to respond, try to look for something you can sincerely acknowledge. The person's description of their own distress is often a good starting point.`}}
]},

{sec:10, type:'prose', title:'The six levels', blocks:[
  {p:`The six levels of validation were developed by psychologist Marsha Linehan as part of dialectical behaviour therapy (DBT) and are used in the 9-8-8 Intervention Manual. They describe different ways to show a person that you understand their experience. Each level builds on the ones before it, but all six can be useful depending on the interaction at hand.`, lede:true},
  {key:[`The goal is to use the highest level you can offer sincerely, based on what the person has shared.`]}
]},

{sec:10, type:'prose', title:'The six levels in practice', blocks:[
  {p:`The following examples show how each level might sound during an interaction with a caller who has just learned that their workplace is closing.`, lede:true},
  {audio:{label:`The caller`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(flat)`, t:`I got the letter today. They're closing the plant in March. I've been there for twenty-two years, and I found out from a letter.`}
  ]}},
  {table:{cols:['Level', 'What it involves', 'How it might sound'], revealRows:true,
    revealCta:`Reveal the first level`, revealMore:`Reveal the next`,
    rows:[
      [`1. Being present`, `Giving the person your full attention and time to speak without judgement. Minimal encouragers and purposeful silence belong here.`, `"Mm-hmm. (pause) I'm listening."`],
      [`2. Accurate reflection`, `Reflecting thoughts and feelings the person has expressed directly. This includes paraphrasing and reflecting a feeling they have named.`, `"Wow, you've been there for twenty-two years and you found out through a letter. How did that leave you feeling?"`],
      [`3. Reading between the lines`, `Naming a possible feeling or concern the person has not expressed directly. Offer it tentatively and check your understanding.`, `"After that long, they couldn't even tell you in person. It sounds like the way they told you hurt, too. Am I getting that right?"`],
      [`4. Understanding the person's behaviour in context`, `Recognizing how the person's feelings and actions make sense given their history and experiences.`, `<em>After the caller says they cannot imagine working anywhere else:</em> "I mean, you've spent twenty-two years there. It makes sense that it's hard to picture what comes next."`],
      [`5. Acknowledging the validity of the person's emotions`, `Acknowledging that their emotional response is understandable in the situation and one that other people could share.`, `<em>After the caller says they feel disrespected:</em> "After finding out through a letter after so many years, it is completely understandable you would feel disrespected."`],
      [`6. Radical genuineness`, `Responding honestly and naturally, while treating the person as capable. This comes through in your tone, word choice, and willingness to work alongside them.`, `"That's a hard way to find out. What feels most important for us to talk about tonight?"`]
    ]}},
  {note:`The names of the levels follow the 9-8-8 Intervention Manual. You may see slightly different names for Levels 4 and 5 in other training materials.`}
]},

{sec:10, type:'prose', title:'Choosing a level', blocks:[
  {p:`The general rule at 9-8-8 is to use the highest level that is available in the moment and feels genuine for you.`, lede:true},
  {ul:[
    `Levels 1 and 2 are always available and useful, and you practised them in Module 5.`,
    `The higher levels depend on what you have noticed and on how much you know about the person's situation.`,
    `As you learn more about the person, you may be able to offer a fuller understanding of how their feelings or actions make sense.`
  ]}
]},

/* Continues "Choosing a level". */
{sec:10, type:'prose', blocks:[
  {p:`The 9-8-8 Suicide Assessment and Safety Planning model gives this sample statement for its second step, actively listening to the narrative:`, lede:true},
  {key:[`"Given what you have told me, it makes sense that you would feel sad, hopeless or angry."`]},
  {p:`This statement reflects Level 4 or 5 validation, depending on the context.`},
  {tip:{p:`Make the connection specific by referring to the experience the person has described and naming the feeling they have expressed.`}}
]},

/* ---------------- ACTIVITY: SPOT THE LEVEL ---------------- */
{sec:11, type:'section', kicker:'Activity', art:'a', tone:'tranquil',
 title:`Spot the level`, line:`Identify the level of validation in six responses to Walter.`},

{sec:11, type:'prose', title:'How this activity works', blocks:[
  {p:`In order to develop the ability to use the levels of validation yourself, it can be useful to learn to recognize the levels in other responders' interactions.`, lede:true},
  {p:`In this activity, you will identify the levels of validation in responses to Walter. This will prepare you to write your own validating responses in the next activity.`},
  {p:`For each response:`},
  {ul:[
    `read what the responder says`,
    `select the level of validation it best illustrates`,
    `review the feedback`
  ]},
  {note:`This activity is not scored. A response may include more than one level. Choose the level that best describes how it communicates understanding.`}
]},

/* The storyboard gives one explanation per response, so each question is
   answered once and the explanation shows whatever is chosen (oneFb). The
   responder's lines carry no audio in the storyboard and must be read to
   answer, so they are shown as transcripts. */
{sec:12, type:'prose', title:'Disclosure (Walter, he/him)', blocks:[
  {p:`Later in the Sunday evening call from Topic 1, Walter talks about how communication has changed since his wife, Margaret, died.`, lede:true},
  {audio:{label:`Walter's disclosure`, ch:'Voice call', lines:WALTER_DISCLOSURE}}
]},

{sec:12, type:'mcq', title:'Response 1',
 intro:[{thread:{ch:'Voice call', lines:[
   {spk:'Responder', t:`Margaret knew how to put things into words. Since she died, you've been keeping things to yourself.`}]}}],
 prompt:`Which level of validation does this response best illustrate?`, hint:`Select the best answer.`,
 oneFb:`The responder restates what Walter has expressed without adding a new feeling or explanation. This shows that the responder has followed his account and gives Walter an opportunity to confirm or clarify it.`,
 options:levelOpts('B')},

{sec:12, type:'mcq', title:'Response 2',
 intro:[{thread:{ch:'Voice call', lines:[
   {spk:'Responder', t:`It's understandable to feel hesitant about bringing this up when your daughter seems to have so much on her plate. Many people would find that difficult.`}]}}],
 prompt:`Which level of validation does this response best illustrate?`, hint:`Select the best answer.`,
 oneFb:`The responder acknowledges that Walter's hesitation makes sense in the situation and is something others could experience. The response stays connected to his concern about his daughter without suggesting that everyone would react the same way.`,
 options:levelOpts('E')},

{sec:12, type:'mcq', title:'Response 3',
 intro:[{thread:{ch:'Voice call', lines:[
   {spk:'Responder', t:`Mm-hmm. <span class="meta">(pause)</span> Take your time, Walter.`}]}}],
 prompt:`Which level of validation does this response best illustrate?`, hint:`Select the best answer.`,
 oneFb:`The minimal encourager, pause, and invitation to take his time convey attention and patience. Walter has just described finding it difficult to speak about his feelings. Giving him time allows him to continue without pressure.`,
 options:levelOpts('A')},

{sec:12, type:'mcq', title:'Response 4',
 intro:[{thread:{ch:'Voice call', lines:[
   {spk:'Responder', meta:`(warmly)`, t:`Well, you've found a way to tell me and I'm so glad you did. I want to understand what this has been like for you.`}]}}],
 prompt:`Which level of validation does this response best illustrate?`, hint:`Select the best answer.`,
 oneFb:`The responder offers a direct, personal response to what Walter has shared and recognizes his ability to express himself. This level depends on sincere delivery and the way the responder relates to Walter. The words need to reflect an honest response in the moment.`,
 options:levelOpts('F')},

{sec:12, type:'mcq', title:'Response 5',
 intro:[{thread:{ch:'Voice call', lines:[
   {spk:'Responder', t:`I wonder if you also miss having someone who could tell when something was wrong, without you having to explain it. Is that part of it?`}]}}],
 prompt:`Which level of validation does this response best illustrate?`, hint:`Select the best answer.`,
 oneFb:`Walter has described Margaret's ability to communicate and his difficulty speaking since her death. The responder suggests another part of the loss that Walter has not directly named. Because this is an interpretation, the responder offers it tentatively and checks whether it fits.`,
 options:levelOpts('C')},

{sec:12, type:'mcq', title:'Response 6',
 intro:[{thread:{ch:'Voice call', lines:[
   {spk:'Responder', t:`Margaret helped you say things that were difficult to put into words. With her gone, I can understand why telling your daughter how you feel has become harder.`}]}}],
 prompt:`Which level of validation does this response best illustrate?`, hint:`Select the best answer.`,
 oneFb:`The responder connects Walter's difficulty expressing himself to Margaret's role in his life and the loss of that support. This goes beyond restating what he said by acknowledging how his current difficulty makes sense given his experience.`,
 options:levelOpts('D')},

/* ---------------- ACTIVITY: RAISE THE LEVEL ---------------- */
{sec:13, type:'section', kicker:'Activity', art:'b', tone:'tranquil',
 title:`Raise the level`, line:`Write a response to Walter at Level 4 or Level 5.`},

/* Following the Module 4 pattern, the briefing carries the opening line and
   the not-scored note; the disclosure, the instructions and the prompt share
   the next page. */
{sec:13, type:'prose', title:'How this activity works', blocks:[
  {p:`In the previous activity, you identified the levels of validation in other responders' words. Now you will practise writing a response that acknowledges why Walter's difficulty expressing himself makes sense.`, lede:true},
  {note:`This activity is not scored. Your response does not need to match the examples. Use what Walter has shared in this interaction and earlier modules, and avoid adding details you do not know.`}
]},

{sec:14, type:'prose', title:"Walter's disclosure", blocks:[
  {p:`Let's return to Walter's disclosure from the start of that activity:`, lede:true},
  {audio:{label:`Walter's disclosure`, ch:'Voice call', lines:WALTER_DISCLOSURE}},
  {p:`For this exercise, imagine a responder offers this Level 2 reflection:`},
  {thread:{ch:'Voice call', lines:[
    {spk:'Responder', t:`Margaret knew how to put things into words. Since she died, you've been keeping things to yourself.`}
  ]}},
  {p:`While this accurately reflects what Walter has said, it does not acknowledge what makes his response understandable.`}
]},

{sec:14, type:'write', title:'Your response',
 intro:[
  {p:`In this activity, you will try to come up with a response at a higher level. In your workbook, try writing a response at either:`, lede:true},
  {ul:[
    `<strong>Level 4: Understanding the person's behaviour in context.</strong> Connect Walter's difficulty expressing himself to what he has shared about Margaret and his life since her death.`,
    `<strong>Level 5: Acknowledging the validity of the person's emotions.</strong> Acknowledge that his hesitation about speaking to his daughter is understandable and something others could experience.`
  ]},
  {key:[`Write a response to Walter that validates his silence at Level 4 or Level 5. Be sure to use what he has told you about Margaret, his daughter and the quiet house.`]}
 ],
 prompts:[`Your response to Walter`], placeholder:`What would you say to Walter?`,
 cta:`Show the examples`,
 feedback:[
  {p:`<strong>Example at level 4:</strong> "Margaret helped you find a way to say difficult things. Without her, I can understand why it's harder to tell your daughter how you feel."`},
  {p:`<strong>What it does:</strong> This response connects Walter's current difficulty to the support he has lost. It explains what makes his response understandable using what he has said about Margaret.`},
  {p:`<strong>Example at level 5:</strong> "Many people would feel hesitant about telling someone they miss them when they're worried about being a bother. It makes sense that this is difficult to say to your daughter."`},
  {p:`<strong>What it does:</strong> This response acknowledges that Walter's hesitation is understandable in the situation and is a feeling others could share. It stays close to his concern without telling him whether to speak to his daughter.`},
  {h3:`Review checklist`},
  {checklist:[
    `Have you explained what makes Walter's reaction understandable?`,
    `Have you stayed close to what he has shared?`,
    `Have you avoided advice or praise?`,
    `Have you left room for him to respond or correct your understanding?`
  ]},
  {p:`Revise any wording that assumes more than you know or does not sound natural to you.`}
 ]},

/* ---------------- TOPIC 4 ---------------- */
{sec:15, type:'section', num:'04', kicker:'Topic 4', art:'c',
 title:`Validating within limits`, line:`How to validate distress without implying agreement, offering praise or endorsing harm`},

/* The storyboard styles these two opening paragraphs as headings; they are
   set as body text. */
{sec:15, type:'prose', blocks:[
  {p:`In Topic 3, you practised recognizing the levels of validation and acknowledging what makes a person's response understandable. Performing this skill well also requires that you pay close attention to what your words may imply.`, lede:true},
  {p:`This topic explores how to validate a caller or texter's experience while maintaining clear limits. Through a series of scenarios, you will learn to distinguish validation from agreement and praise, and practise acknowledging distress without affirming self-harm or suicide.`},
  {panel:{cls:'blue', p:`These distinctions will also help guide your responses in the simulated interactions in Module 7.`}}
]},

{sec:15, type:'prose', title:'Validation is not agreement', blocks:[
  {p:`In Module 2, you learned how arguing with a person's experience can discourage them from sharing. Validation gives you a way to respond to their distress while also leaving room to understand more.`, lede:true},
  {p:`As a 9-8-8 responder, you can validate that a feeling is understandable without agreeing with a belief, an intention, a behaviour or a claim that you cannot verify.`},
  {p:`Consider, for example, some possible responses to a caller who says, "I'm a burden to everyone around me."`},
  {table:{cols:['Response', 'What it does'], revealRows:true,
    revealCta:`Reveal the first response`, revealMore:`Reveal the next`,
    rows:[
      [`"You're right. It probably would be easier for them."`, `Confirms the caller's belief that they are a burden and may reinforce the distress connected to it.`],
      [`"That's not true. Your family loves you."`, `Contradicts the caller and makes an assumption about their family. The caller may feel misunderstood or become less willing to explain why they feel this way.`],
      [`"It sounds painful to feel that the people around you would be better off without your support needs. Am I understanding you?"`, `Attempts to acknowledge the distress, but adds an interpretation about support needs that the caller has not expressed. A closer response would be: "It sounds painful to feel like a burden to the people around you. What's been happening that leaves you feeling that way?"`]
    ]}}
]},

{sec:15, type:'prose', title:'Responding to claims you cannot verify', blocks:[
  {p:`In your interactions, a caller or texter may describe being hurt by someone else's behaviour. Your role as a 9-8-8 responder is to take their account seriously and acknowledge how the experience has affected them. You can do this without claiming to know the other person's motives or making judgements about someone you have not spoken with.`, lede:true},
  {tip:{p:`Be sure to keep your response grounded in what the caller or texter has shared (i.e., what happened from their perspective, how they felt and what it has meant for them). This allows you to communicate understanding while being honest about what you know.`}}
]},

{sec:15, type:'prose', title:'Validation is not praise', blocks:[
  {p:`In Modules 4 and 5, you practised acknowledging a person's strengths without evaluating them. You saw this with Walter: when the responder praised him for answering his granddaughter's letters, he dismissed the effort involved.`, lede:true},
  {p:`The reason we try to avoid praise is because it communicates approval. In so doing, it can:`},
  {ul:[
    `shift the person's attention towards your opinion`,
    `leave them feeling pressure to meet your expectations.`
  ]},
  {p:`Validation, on the other hand, communicates understanding of their experience and their response to it.`}
]},

/* Continues "Validation is not praise". */
{sec:15, type:'prose', blocks:[
  {p:`If a caller or texter asks for praise, consider what they may be seeking reassurance about. They may want you to:`, lede:true},
  {ul:[
    `recognize how hard something was`,
    `understand their fear that they have not done enough`
  ]},
  {panel:{cls:'blue', p:`Reflecting those concerns gives them room to explain what matters to them.`}}
]},

{sec:15, type:'prose', title:'Validating distress without affirming harm', blocks:[
  {p:`When a person shares thoughts of suicide or self-harm, validation helps you acknowledge the suffering connected to those thoughts.`, lede:true},
  {p:`The 9-8-8 Intervention Manual directs you as a responder to find something you can sincerely validate while avoiding validation of harmful behaviours, including self-harm or suicide.`},
  {p:`Here is an example:`},
  {tabs:[
    {label:`Say`, p:`"Given what you have shared with me, it is understandable that you feel hopeless."`},
    {label:`Do not say`, p:`"Given what you have shared with me, it is understandable that you want to end your life."`}
  ]}
]},

/* Continues "Validating distress without affirming harm". */
{sec:15, type:'prose', blocks:[
  {p:`At 9-8-8, we know that acknowledging how common thoughts of suicide are can help reduce shame. The role of validation in this context is to focus on the pain connected to those thoughts:`, lede:true},
  {ul:[
    `exhaustion`,
    `hopelessness`,
    `wanting the suffering to stop`
  ]},
  {p:`These experiences deserve recognition and can be addressed skillfully. As a responder, you must always avoid affirming suicidal thoughts or actions that could cause harm. The same principle applies to self-harm.`},
  {note:`Responses to disclosures of suicidal thoughts, self-harm or risk to another person are taught in the SASP course and set out in the 9-8-8 standard operating procedures. This module focuses on validation; assessment and safety planning are covered separately.`}
]},

{sec:15, type:'prose', title:'Talking about MAID', blocks:[
  {p:`This same limit around validation applies when a caller or texter raises medical assistance in dying (MAID).`, lede:true},
  {p:`Medical assistance in dying (MAID) is mentioned in approximately one or two out of every hundred 9-8-8 interactions, so it is important to be prepared for these conversations.`},
  {p:`Here, the 9-8-8 model for validating distress without affirming harm continues to apply. When a caller or texter raises MAID:`},
  {ul:[
    `Validate the sources of their suffering`,
    `Avoid validating MAID itself or describing it as understandable or inevitable`,
    `Do not provide advice or information about MAID`,
    `Ask the screening questions as you would in every interaction`
  ]}
]},

/* ---------------- ACTIVITY: VALIDATION LIMIT CASES (PART 1) ---------------- */
{sec:16, type:'section', kicker:'Activity', art:'d', tone:'tranquil',
 title:`Validation limit cases (Part 1)`, line:`Choose responses that acknowledge distress while maintaining limits in four conversations.`},

{sec:16, type:'prose', title:'How this activity works', blocks:[
  {p:`Now let's practise choosing responses that acknowledge suffering while maintaining these limits.`, lede:true},
  {p:`In this activity, you will work through six short conversations. Two of these conversations return to people you have met before, and four introduce new callers or texters. For the first four conversations:`},
  {ul:[
    `listen to or read what the person says`,
    `select the response that validates their distress while maintaining the relevant limit`,
    `notice how the person responds`
  ]},
  {p:`In the last two conversations, you will write the response yourself and compare it with an example.`},
  {note:`This activity is not scored. In the first four conversations, you can explore the other options after each choice and compare the person's reactions. In the last two, you will write the response yourself. Keep your written responses in your workbook.`},
  {note:`These excerpts focus on validation. Procedures for suicide risk, self-harm, risk of harm to others and child protection are covered in the SASP course and the 9-8-8 standard operating procedures. Validation remains part of the interaction as you ask required safety questions and respond to risk.`}
]},

{sec:17, type:'respond', title:'Case 1 (Simon, he/him)', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`Simon, 23, has been on the call for about ten minutes. He has described a week in which everything has felt too loud. He has told you that he hurts himself when this happens and expects you to disapprove.`, lede:true},
  {note:`The safety questions that follow a disclosure of self-harm are covered in the SASP course and are not shown here.`},
  {audio:{label:`Simon's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(tense)`, t:`Look, I know what you're going to say. But it's the only thing that works. When it gets that loud in my head, that's the one thing that shuts it off. I've tried the breathing, the walking, all of it. <span class="meta">(pause)</span> I don't need a lecture.`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`"I hear you. If that's what gets you through, then that's what gets you through. Everyone needs something that works for them, and I'm not going to judge you for yours."`,
   reply:[
    {spk:'Caller', meta:`(pause)`, t:`Right. <span class="meta">(uncertain)</span> So that's it, then. <span class="meta">(pause)</span> I don't know why I called.`}
   ]},
  {k:'B', t:`"It makes sense that you'd reach for whatever helps, but hurting yourself isn't a safe way to cope. Have you thought about what else you could do when it gets that loud?"`,
   reply:[
    {spk:'Caller', meta:`(sharper)`, t:`See, this is the lecture. I told you, I've tried the other stuff. <span class="meta">(pause)</span> Forget it.`}
   ]},
  {k:'C', t:`"You've tried other ways to get some relief, and you're telling me they haven't helped. I want to understand what it's like when it gets that loud."`,
   reply:[
    {spk:'Caller', meta:`(a breath)`, t:`Okay. <span class="meta">(pause)</span> It starts in the afternoon, usually. Like a pressure. By night it's all I can hear.`}
   ]}
 ],
 closingBlocks:[
  {p:`Simon has described the relief he seeks and made clear that he expects criticism.`},
  {p:`<strong>Response A</strong> risks endorsing self-harm as his solution. The intention is to communicate acceptance, but "if that's what gets you through" can sound like approval of the behaviour.`},
  {p:`<strong>Response B</strong> moves quickly towards changing the behaviour. Asking about alternatives may be useful as the interaction develops. Here, the question overlooks Simon's statement that he has already tried other approaches, and he hears the lecture he expected.`},
  {p:`<strong>Response C</strong> acknowledges his efforts to find relief and invites him to describe the distress. It takes his account seriously without presenting self-harm as safe or acceptable. His response gives the responder more information about what he is experiencing.`}
 ]},

/* "(A minute passes.)" before Noor's reply to option A is shown as a
   timestamp gap (Module 4 rule). The start time is a build choice. */
{sec:17, type:'respond', title:'Case 2 (Noor, she/her)', ch:'Text', startTime:'9:40 PM',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`Noor, 31, has been texting for about twenty minutes about her partner. She has described him checking her phone and telling her that she imagines things.`, lede:true},
  {note:`Questions about safety in a relationship, including intimate partner violence, follow the SASP model and are not shown here.`},
  {thread:{ch:'Text', startTime:'9:40 PM', lines:[
    {who:'them', spk:'Texter', t:`My sister says I'm being a bit extra`},
    {who:'them', spk:'Texter', t:`But you can see it right? He's straight up abusive. Tell me you see that`},
    {who:'them', spk:'Texter', t:`I just need to hear someone say it`}
  ]}}
 ],
 prompt:`What do you send?`,
 options:[
  {k:'A', t:`"You've described him checking your phone and dismissing what you say. I take that seriously. It makes sense that you want someone to believe you when you keep being told you're imagining things or being dramatic."`,
   reply:[
    {spk:'Texter', wait:1, t:`Okay`},
    {spk:'Texter', t:`Nobody has said that it's real like that`},
    {spk:'Texter', t:`It's been really bad lately`}
   ]},
  {k:'B', t:`"Yes, Noor. He's abusive, and you need to leave. Nobody should have to live like that, and your sister should be backing you up."`,
   reply:[
    {spk:'Texter', t:`Okay`},
    {spk:'Texter', t:`My sister says that too and then she gets mad when I don't leave`},
    {spk:'Texter', t:`Everyone just says leave`}
   ]},
  {k:'C', t:`"I'm only hearing one side of this, Noor, so it wouldn't be fair for me to put a label on him from here. Can you tell me more about what has been happening between the two of you?"`,
   reply:[
    {spk:'Texter', t:`Wow`},
    {spk:'Texter', t:`Okay`},
    {spk:'Texter', t:`So you think I'm just making it up too?`},
    {sys:`The typing indicator does not return.`}
   ]}
 ],
 closingBlocks:[
  {p:`Noor is asking to be believed after having her experience repeatedly dismissed.`},
  {p:`<strong>Response A</strong> takes her account seriously and names the behaviours she has described earlier in the conversation. It acknowledges why being believed matters to her without making claims about her partner's motives. Noor continues and indicates that the situation has worsened.`},
  {p:`<strong>Response B</strong> moves from a judgement about her partner to instructions about leaving. Recognizing harmful or controlling behaviour may be appropriate at some point. The problem here is that the responder decides what Noor should do and adds an opinion about her sister before exploring Noor's circumstances and safety.`},
  {p:`<strong>Response C</strong> places doubt at the centre of the reply. Although the question invites more detail, "only hearing one side" suggests that Noor's account alone is insufficient to take seriously. You can acknowledge what she describes and its effect on her while also being careful about claims you cannot verify.`}
 ]},

{sec:17, type:'respond', title:'Case 3 (Marc, he/him)', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`Marc, 29, whom you met in Module 1, called 9-8-8 for the first time because thoughts about a former coworker frightened him. Later in the call, he says more.`, lede:true},
  {note:`Procedures related to risk of harm to others are covered in the SASP course and the 9-8-8 standard operating procedures.`},
  {audio:{label:`Marc's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(tense, halting)`, t:`I know how this sounds. But part of me thinks he deserves it. He took everything, and he's just... fine. <span class="meta">(pause)</span> And then I get scared of myself for thinking it. Both at the same time.`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`"Anyone who lost their job because of someone like that would want to get back at him, Marc. That's only human. I don't think you should be so hard on yourself for it."`,
   reply:[
    {spk:'Caller', meta:`(quiet)`, t:`So you think I'm right. <span class="meta">(long pause)</span> That's not what I wanted to hear.`}
   ]},
  {k:'B', t:`"You're angry about what you lost, and frightened by the thoughts you're having. I can understand those feelings. You've reached out because you're worried about what you might do."`,
   reply:[
    {spk:'Caller', meta:`(exhales)`, t:`Yeah. That's... yeah. <span class="meta">(pause)</span> I don't want to be the guy who does something.`}
   ]},
  {k:'C', t:`"Marc, I need you to stop and listen to me for a second. Thoughts like that are serious, and you can't let yourself go there, no matter what he did to you."`,
   reply:[
    {spk:'Caller', meta:`(flat)`, t:`Right. <span class="meta">(long pause)</span> Forget I said anything.`}
   ]}
 ],
 closingBlocks:[
  {p:`Marc describes anger about his losses and fear about his own thoughts. Both feelings need to be heard without affirming harm towards his former coworker.`},
  {p:`<strong>Response A</strong> presents retaliation as an expected response. Marc hears agreement with the part of his thinking that frightens him.`},
  {p:`<strong>Response B</strong> acknowledges the anger and fear as feelings. It recognizes why Marc reached out without agreeing that his former coworker deserves harm. In response, Marc confirms the response and says more about his concern.`},
  {p:`<strong>Response C</strong> communicates judgement and tells Marc to stop having the thoughts. Marc's reply suggests that he may stop being open about his thoughts. Taking risk seriously includes making it possible for the person to speak openly while you continue to follow the required procedures.`}
 ]},

/* The options open with a delivery cue; `say` keeps it as a stage direction
   in the transcript rather than as spoken words. */
{sec:17, type:'respond', title:'Case 4 (Evan, he/him)', ch:'Voice call',
 feedbackCta:`Show the feedback`,
 intro:[
  {p:`Evan, 44, has been on the call for several minutes. He speaks in short sentences and pauses often. He says he has never told anyone what he is about to share.`, lede:true},
  {note:`Procedures related to child protection and risk of harm to others are covered in the SASP course and the 9-8-8 standard operating procedures.`},
  {audio:{label:`Evan's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(barely audible)`, t:`Okay, so, I'm attracted to children. I've never... I would never. I've never touched anyone. <span class="meta">(pause)</span> But the feeling's there, and I hate myself for it. I don't know how to live with being like this.`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`(carefully) "That must be really hard to say out loud. Have you ever been around children in a way that worried you? I need to ask you some questions about safety before we go any further."`,
   say:`<span class="meta">(carefully)</span> That must be really hard to say out loud. Have you ever been around children in a way that worried you? I need to ask you some questions about safety before we go any further.`,
   reply:[
    {spk:'Caller', meta:`(pause)`, t:`I just said I never have. <span class="meta">(quieter)</span> Oh gosh, I knew this would happen.`}
   ]},
  {k:'B', t:`(gently) "It's very brave of you to say this. A lot of people have thoughts they would never act on, and you shouldn't be so hard on yourself about it. You're clearly a good person."`,
   say:`<span class="meta">(gently)</span> It's very brave of you to say this. A lot of people have thoughts they would never act on, and you shouldn't be so hard on yourself about it. You're clearly a good person.`,
   reply:[
    {spk:'Caller', meta:`(sharper)`, t:`Don't do that. Don't tell me it's normal. <span class="meta">(pause)</span> It isn't.`}
   ]},
  {k:'C', t:`(steady) "Thank you for telling me. I hear how painful this is to talk about and how much you hate yourself right now. You've also told me you haven't acted on it. I want you to know that I'm here to listen. I want to understand how this is affecting you and talk with you about safety."`,
   say:`<span class="meta">(steady)</span> Thank you for telling me. I hear how painful this is to talk about and how much you hate yourself right now. You've also told me you haven't acted on it. I want you to know that I'm here to listen. I want to understand how this is affecting you and talk with you about safety.`,
   reply:[
    {spk:'Caller', meta:`(a long breath)`, t:`Oh wow. You're still there. <span class="meta">(pause)</span> Nobody else knows. I just thought you'd hang up.`}
   ]}
 ],
 closingBlocks:[
  {p:`Evan has disclosed an attraction he expects others to condemn and described intense distress about himself. The responder needs to acknowledge that distress while following the required safety procedures.`},
  {p:`<strong>Response A</strong> briefly acknowledges the difficulty of speaking, then makes further conversation conditional on answering safety questions. Those questions are necessary, but the issue is how the transition is framed: "before we go any further" may sound like a barrier to being heard. Evan's response indicates that he feels suspected of a crime.`},
  {p:`<strong>Response B</strong> offers praise and a broad judgement about Evan's character. It also tells him how he should feel about himself. These reassurances go beyond what the responder knows and do not address the distress he has described.`},
  {p:`<strong>Response C</strong> acknowledges the pain and isolation of the disclosure without agreeing with Evan's judgement of himself. It accurately attributes the statement about his behaviour to him, keeps him engaged, and makes room for a conversation about safety. It does not endorse harm or treat his account as a substitute for assessment.`},
  {note:`Interactions like this can affect responders negatively. The 9-8-8 Safety and Wellbeing Framework includes supervision and debriefing as part of responder practice. Remember that your supervisor is available to provide support and debriefing after difficult interactions like these.`}
 ]},

{sec:18, type:'section', kicker:'Activity', art:'e', tone:'tranquil',
 title:`Validation limit cases (Part 2)`, line:`Write your own responses to Ruth and Maya and compare them with an example.`},

{sec:18, type:'prose', title:'How this activity works', blocks:[
  {p:`In the first four conversations, you selected a response and considered how the person reacted. In these final two cases, you will write your own response.`, lede:true},
  {p:`For each case:`},
  {ul:[
    `identify what you can validate`,
    `write your response`,
    `then compare it with the example and review checklist`
  ]},
  {note:`Your responses are not scored and do not need to match the examples. Use wording that fits what the person has shared and sounds natural to you.`}
]},

{sec:19, type:'write', title:'Case 5 (Ruth, she/her)',
 intro:[
  {p:`Ruth, 68, has lived with a progressive illness for eleven years. She called 9-8-8 after an argument with her daughter. Earlier in the call, you asked the screening questions, and Ruth said she was not having thoughts of suicide.`, lede:true},
  {note:`Responders do not provide advice or information about MAID. A person who asks about the process is directed to their primary care provider or another health care provider.`},
  {audio:{label:`Ruth's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(slowly)`, t:`I've been sick for eleven years. I can't do the things that made me who I was, and my daughter does everything for me now. I've started looking into MAID. <span class="meta">(pause)</span> Everyone keeps telling me not to talk like that.`}
  ]}},
  {key:[`Write a response that acknowledges Ruth's suffering and states the limit on MAID advice and information.`]},
  {tip:{p:`Keep the conversation open to her experience without validating MAID itself.`}}
 ],
 prompts:[`Your response to Ruth`], placeholder:`What would you say to Ruth?`,
 cta:`Show the example`,
 feedback:[
  {p:`<strong>Example:</strong> "You've lost activities that helped you feel like yourself, and when you try to talk, people tell you to stop. That sounds lonely. I can't provide advice or information about MAID, but I do want to understand what these years have been like for you."`},
  {p:`<strong>What it does:</strong> This response acknowledges Ruth's losses and the loneliness of feeling unheard. It states the responder's limit clearly while inviting her to describe her experience. In this example, Ruth takes a long breath and replies: "Lonely. Yes. Nobody asks what it's been like. They just tell me what not to say."`},
  {h3:`Review checklist`},
  {checklist:[
    `Have you acknowledged Ruth's losses and her experience of feeling unheard?`,
    `Have you given her room to describe her suffering before offering reassurance or suggesting alternatives?`,
    `Have you avoided describing MAID as understandable, inevitable or the right choice?`,
    `Have you avoided making assumptions about her daughter or taking sides against her family?`,
    `Have you stated the limit on advice and information while showing that you are willing to listen?`
  ]}
 ]},

{sec:19, type:'write', title:'Case 6 (Maya, she/her)',
 intro:[
  {p:`You are continuing the text interaction with Maya from Topic 2. She has just explained that she is frightened of what it might mean if her roommate does not answer the door.`, lede:true},
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`Can you just tell me I'm not a horrible friend?`},
    {who:'them', spk:'Texter', t:`I feel like I need to hear someone say it.`}
  ]}},
  {key:[`Write a message that acknowledges Maya's efforts and fear.`]},
  {tip:{p:`Respond to the concern behind her request without evaluating what kind of friend she is.`}}
 ],
 prompts:[`Your message to Maya`], placeholder:`What would you send?`,
 cta:`Show the example`,
 feedback:[
  {p:`<strong>Example:</strong> "You've kept trying to approach her, and you're talking with me about it tonight. It sounds like you care about her and you're afraid of getting it wrong."`},
  {p:`<strong>What it does:</strong> This response recognizes what Maya has done and tentatively names the fear connected to it. It gives her something specific to respond to without relying on praise. In this example, Maya replies: "Yeah. I am scared of getting it wrong. I think that's why I keep not knocking."`},
  {h3:`Review checklist`},
  {checklist:[
    `Have you acknowledged what Maya has done and what she fears?`,
    `Have you stayed close to her words and the details she has shared?`,
    `Have you avoided praise such as "amazing friend" or "she's lucky to have you"?`,
    `Have you responded to her concern rather than simply saying you cannot judge?`,
    `Does your message leave room for Maya to explain more?`
  ]}
 ]},

{sec:19, type:'prose', title:'Activity debrief', blocks:[
  {p:`Across the six conversations, you practised acknowledging distress while maintaining the limits of validation. The strongest responses:`, lede:true},
  {ul:[
    `<strong>Recognized something specific:</strong> pain, fear, loss, effort or the need to be believed.`,
    `<strong>Made clear what was being validated:</strong> the person's feelings and experience, without endorsing harm, approving MAID or making unsupported judgements.`,
    `<strong>Kept attention on the person:</strong> using their words and circumstances to guide the response.`,
    `<strong>Supported continued disclosure:</strong> leaving room for the person to clarify, correct or say more.`
  ]},
  {panel:{cls:'blue', p:`Validation continues alongside assessment, safety planning and other required actions. The SASP model and the 9-8-8 standard operating procedures should always guide how you respond to what the person shares next.`}}
]},

/* ---------------- TOPIC 5 ---------------- */
{sec:20, type:'section', num:'05', kicker:'Topic 5', art:'a',
 title:`Recognizing and revising invalidation`, line:`How to identify responses that dismiss or minimize a person's experience and revise them to convey understanding`},

{sec:20, type:'prose', blocks:[
  {p:`In Topic 4, you practised acknowledging distress while maintaining the limits of validation. This final topic focuses on recognizing when a response leaves a person feeling that their experience has been dismissed.`, lede:true},
  {p:`<strong>Invalidation</strong> occurs when a response:`},
  {ul:[
    `Dismisses`,
    `Minimizes`,
    `Or rejects a person's thoughts, feelings or experience.`
  ]},
  {p:`In Module 2, you examined responses that minimize, argue, moralize, invoke guilt or offer reassurance too soon. Here, you will consider how these responses are received and practise revising them.`},
  {panel:{cls:'blue', p:`It's important to acknowledge that invalidation is not always intentional. It can happen even though you have good intentions or are trying to help. The wish to reassure someone or offer a different perspective, however, can cause you to overlook what they need you to understand in the moment.`}}
]},

{sec:20, type:'prose', title:'How invalidation is received', blocks:[
  {p:`Researchers in Australia asked people who had been at risk of suicide which responses they had found most helpful and most unhelpful:`, lede:true},
  {ul:[
    `The most unhelpful responses minimized their thoughts and feelings or suggested that their difficulties were not real.`,
    `Helpful responses included listening without judgement, asking directly about suicide and showing care.`
  ]},
  {p:`Members of the 9-8-8 Lived Experience Advisory Team have described similar experiences. Two of the behaviours they identified as unhelpful or harmful were:`},
  {ul:[
    `Expressing sympathy in a way that felt like pity`,
    `Summarizing their feelings incorrectly and then insisting on that summary when they objected`
  ]}
]},

/* Continues "How invalidation is received". The accounts have no script yet,
   so the placeholder carries no transcript (nothing is invented to fill it). */
{sec:20, type:'prose', blocks:[
  {p:`For example, a response beginning with "at least" may be intended to offer perspective. However, the caller or texter may hear that their pain is less serious than someone else's or that they should not feel as they do.`, lede:true},
  {p:`Listen to the following accounts from 9-8-8 community members with lived experience. Notice what minimizing and "at least" responses communicated to them about whether their pain was understood and welcome in the conversation.`},
  {audio:{label:`Accounts from community members with lived experience`}}
]},

{sec:20, type:'prose', title:'Common forms of invalidation', blocks:[
  {p:`When a caller or texter's distress is intense, you may feel pressure to reassure them, offer perspective or find something positive. Recognizing how these responses can invalidate a caller or texter's experience helps you pause and choose words that acknowledge their experience.`, lede:true},
  {p:`The table below describes five common forms and how a caller or texter might receive them:`},
  {table:{cols:['Form', 'Example', 'How it may be received'], revealRows:true,
    revealCta:`Reveal the first form`, revealMore:`Reveal the next`,
    rows:[
      [`"At least" statements`, `"At least you still have your job."`, `The caller or texter may feel that they should be grateful and stop talking about what hurts.`],
      [`Minimizing and comparing`, `"It's not that bad." "Other people have it much worse."`, `The caller or texter may hear that their distress is too minor to deserve attention.`],
      [`Reassurance that bypasses the pain`, `"Don't worry, things will get better." "You have so much to live for."`, `The caller or texter may feel pushed to adopt a more positive outlook before they have been understood. Other 9-8-8 training refers to this as cheerleading or a silver lining response.`],
      [`Pity`, `"Oh, you poor thing. That's just awful."`, `The caller or texter may feel looked down on or seen as helpless.`],
      [`Insisting on your reflection`, `"No, I really do think you're angry about this."`, `The caller or texter may hear that your interpretation matters more than their own account of their feelings.`]
    ]}}
]},

/* Continues "Common forms of invalidation". */
{sec:20, type:'prose', blocks:[
  {p:`These responses are natural and can reflect your discomfort with what you are hearing, especially when you cannot see a solution.`, lede:true},
  {tip:{p:`When you are in the middle of an interaction like this, notice the urge to make the caller or texter feel better quickly, and return your attention to what they are telling you.`}},
  {panel:{cls:'blue', p:`In Module 2, you learned that hope at 9-8-8 is grounded in understanding. Recognizing the person's distress helps you explore possibilities that are relevant to their experience and meaningful to them.`}}
]},

/* ---------------- ACTIVITY: FROM INVALIDATION TO VALIDATION ---------------- */
{sec:21, type:'section', kicker:'Activity', art:'b', tone:'tranquil',
 title:`From invalidation to validation`, line:`Revise three invalidating replies and practise saying your responses aloud.`},

{sec:21, type:'prose', title:'How this activity works', blocks:[
  {p:`In this final activity, you will revise three invalidating replies and practise saying your responses aloud. Recording and listening back will help you notice how your wording and delivery might be received by a caller.`, lede:true},
  {p:`For each reply:`},
  {ul:[
    `listen to the caller and the responder's reply`,
    `identify what makes the reply invalidating`,
    `record a revised response using your device's audio recorder`,
    `listen back, then compare your response with the example`
  ]},
  {note:`This activity is not scored, and you do not need to submit your recordings. Your wording does not need to match the examples. If you cannot record, write your responses instead. These are fictional practice interactions.`}
]},

/* The learner records on their own device; the text field is for anyone who
   cannot record, as the briefing allows. */
{sec:22, type:'write', title:'Reply 1',
 intro:[
  {audio:{label:`Reply 1`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(tired)`, t:`They cut my hours again. I'm down to two shifts a week. I don't know how I'm going to make rent.`},
    {spk:'Responder (draft)', t:`At least you still have the job. A lot of people don't even have that right now.`}
  ]}},
  {key:[`Record your revision. Be sure to acknowledge the caller's concern about paying rent without comparing their situation to anyone else's.`]}
 ],
 prompts:[`If you cannot record, write your revision`], placeholder:`Your revised response`,
 cta:`Show the example`,
 feedback:[
  {p:`<strong>Example:</strong> "Your hours have been cut again, and you don't know how you'll cover rent. It sounds like you're frightened about that. Have I got that right?"`},
  {audio:{label:`Example response`, ch:'Voice call', lines:[
    {spk:'Responder', t:`Your hours have been cut again, and you don't know how you'll cover rent. It sounds like you're frightened about that. Have I got that right?`}
  ]}},
  {p:`<strong>What it does:</strong> The original reply suggests that having a job should make the caller feel better about their situation. The revision stays with the financial uncertainty they described and offers a possible feeling for them to confirm or correct. As you listen back, check whether your response acknowledges this caller's concern and gives them room to say more.`}
 ]},

{sec:22, type:'write', title:'Reply 2',
 intro:[
  {audio:{label:`Reply 2`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(flat)`, t:`I failed the licensing exam again. Third time. Everyone else from my class passed ages ago.`},
    {spk:'Responder (draft)', t:`Don't be so hard on yourself! Third time lucky, right? You'll get it next time, I'm sure of it.`}
  ]}},
  {key:[`Record your revision. Be sure to respond to what the caller is experiencing now without predicting the result of another attempt.`]}
 ],
 prompts:[`If you cannot record, write your revision`], placeholder:`Your revised response`,
 cta:`Show the example`,
 feedback:[
  {p:`<strong>Example:</strong> "You've tried three times, and seeing your classmates pass makes this feel even harder. Am I understanding that correctly?"`},
  {audio:{label:`Example response`, ch:'Voice call', lines:[
    {spk:'Responder', t:`You've tried three times, and seeing your classmates pass makes this feel even harder. Am I understanding that correctly?`}
  ]}},
  {p:`<strong>What it does:</strong> The original reply tries to reassure the caller by promising an outcome the responder cannot know. The revision acknowledges both the repeated attempts and the comparison the caller has made with their classmates, then checks the responder's understanding. As you listen back, notice whether your tone gives the caller room to express disappointment or pushes them towards feeling hopeful.`}
 ]},

{sec:22, type:'write', title:'Reply 3',
 intro:[
  {audio:{label:`Reply 3`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(crying)`, t:`I know it sounds stupid, but my cat died yesterday and I can't stop crying. She was all I had.`},
    {spk:'Responder (draft)', t:`I'm sorry, but try to keep it in perspective. It's a pet, and there are people out there dealing with much worse things.`}
  ]}},
  {key:[`Record your revision. Be sure to acknowledge the caller's grief and what their cat meant to them without comparing their loss to anyone else's.`]}
 ],
 prompts:[`If you cannot record, write your revision`], placeholder:`Your revised response`,
 cta:`Show the example`,
 feedback:[
  {p:`<strong>Example:</strong> "She meant so much to you. It makes sense that losing her hurts this much. You can talk about her here."`},
  {audio:{label:`Example response`, ch:'Voice call', lines:[
    {spk:'Responder', t:`She meant so much to you. It makes sense that losing her hurts this much. You can talk about her here.`}
  ]}},
  {p:`<strong>What it does:</strong> The original reply minimizes the relationship and suggests that other losses deserve more attention. The revision recognizes the significance of the loss and makes room for the caller to express their grief. As you listen back, check for wording that could minimize the loss, such as suggesting another cat or moving quickly to reassurance that the grief will pass.`}
 ]},

{sec:22, type:'prose', title:'Listening back', blocks:[
  {p:`After recording all three replies, listen to them in sequence. Ask yourself:`, lede:true},
  {checklist:[
    `Have I stayed close to what each caller shared?`,
    `Have I offered inferred feelings tentatively?`,
    `Have I avoided comparisons, predictions and judgements?`,
    `Does my delivery sound calm and unhurried, as I practised in Module 4?`,
    `Have I left room for the caller to respond?`
  ]},
  {p:`Notice any changes in your pace or pitch when you feel an urge to reassure. To take your learning further, try choosing one response to revise and record again.`}
]},

  {p:`In this module, you practised reflecting emotions, recognizing the six levels of validation, validating within limits and revising invalidating responses. Live practice gives you an opportunity to use these skills as a person's feelings emerge and change during a conversation.`, lede:true},

]},
