function blocks(list, root){
  list.forEach(b=>{
    if(b.p) root.append(el('p', [b.lede?'lede':'', b.indent?'indent':''].join(' ').trim()||null, H(b.p)));
    else if(b.instr) root.append(el('p','instr','<em>'+H(b.instr)+'</em>'));
    else if(b.h3) root.append(el('h3', null, H(b.h3)));
    else if(b.ul) root.append(listEl('ul', b.ul));
    else if(b.ol) root.append(listEl('ol', b.ol));
    else if(b.panel) root.append(el('div','panel '+(b.panel.cls||''), (b.panel.h?'<h4>'+b.panel.h+'</h4>':'')+'<p>'+H(b.panel.p)+'</p>'));
    else if(b.note) root.append(el('div','note','<p>'+H(b.note)+'</p>'));
    else if(b.key) root.append(el('div','keycall', b.key.map(t=>'<p>'+H(t)+'</p>').join('')));
    else if(b.cards) root.append(cardsEl(b.cards));
    else if(b.flip) root.append(flipEl(b.flip));
    else if(b.tabs) root.append(tabsEl(b.tabs, b.select));
    else if(b.acc) root.append(accEl(b.acc));
    else if(b.reveal) root.append(revealEl(b.reveal));
    else if(b.checklist) root.append(checklistEl(b.checklist));
    else if(b.carousel) root.append(carouselEl(b.carousel));
    else if(b.table) root.append(tableEl(b.table));
    else if(b.thread) root.append(threadEl(b.thread));
    /* Labelled placeholders for a storyboard's [Insert image of …] and [Insert video here]. */
    else if(b.image) root.append(el('div','video','<div class="frame still"><span class="lbl">'+H(b.image.label||'Image')+' &middot; image to be added</span></div>'));
    else if(b.video) root.append(el('div','video','<div class="frame"><span class="play" aria-hidden="true"></span><span class="lbl">'+H(b.video.label||'Video')+' &middot; video to be produced</span></div>'));
    else if(b.tip) root.append(tipEl(b.tip));
    /* An audio block with no `lines` is a recording whose script does not
       exist yet (Module 6's lived-experience accounts): it gets a placeholder
       bar and no transcript button, so nothing is invented to fill it. */
    else if(b.audio) root.append(audioEl({label:b.audio.label, open:b.audio.open, src:b.audio.src,
      transcript: b.audio.lines ? threadEl({ch:b.audio.ch||'Voice call', lines:b.audio.lines}) : null}));
  });

}

  let first=0;

    first = ks.every(k=>k===ks[0]) ? (sel.same??0) : (sel.diff??0);

  list.setAttribute('role','tablist'); panel.setAttribute('role','tabpanel');
  /* A tab takes `p` for a single paragraph, or `blocks` when its body needs

  const show=n=>{ [...list.children].forEach((b,i)=>b.setAttribute('aria-selected', i===n));

  items.forEach((it,i)=>{ const b=el('button',null,it.label); b.setAttribute('role','tab'); b.onclick=()=>show(i); list.append(b); });
  d.append(list,panel); show(first); return d;

function accEl(items){
  const d=el('div','acc');
  items.forEach(it=>{
    const w=el('div','acc-item','<button aria-expanded="false"><span>'+H(it.q)+'</span><span class="plus"></span></button>'+
      '<div class="acc-body"></div>');
    const body=w.querySelector('.acc-body');
    if(it.blocks) blocks(it.blocks, body);
    else body.append(el('p',null,H(it.a)));
    const b=w.querySelector('button');
    b.onclick=()=>{ const on=w.classList.toggle('on'); b.setAttribute('aria-expanded', on); };
    d.append(w);
  });
  return d;
}
/* Checklist: items the learner ticks off as they review their own work.
   Ticks are not stored or scored. */
let ckSeq=0;
function checklistEl(items){
  const w=el('div','checklist');
  items.forEach(t=>{
    const row=el('label','ck');
    const box=document.createElement('input'); box.type='checkbox'; box.id='ck'+(ckSeq++);
    box.onchange=()=>row.classList.toggle('on',box.checked);
    row.append(box, el('span','box'), el('span','t',H(t)));
    w.append(row);
  });

}
/* Carousel: one item at a time, with previous/next, a counter and dots.
   Items are strings (set as quotes when `quote:true`) or {h, p, blocks}.
   Slides share one grid cell, so the carousel keeps the height of the
   tallest and the page does not jump. */
function carouselEl(c){
  const wrap=el('div','carousel'); wrap.setAttribute('role','group');
  wrap.setAttribute('aria-roledescription','carousel');
  if(c.label) wrap.setAttribute('aria-label',c.label);
  const track=el('div','car-track'); track.setAttribute('aria-live','polite');
  const n=c.items.length;
  const slides=c.items.map((it,i)=>{
    const sl=el('div','car-slide'); sl.setAttribute('role','group');
    sl.setAttribute('aria-roledescription','slide'); sl.setAttribute('aria-label',(i+1)+' of '+n);
    if(typeof it==='string') sl.append(el('p',c.quote?'car-quote':null,H(it)));
    else { if(it.h) sl.append(el('h4',null,H(it.h))); if(it.p) sl.append(el('p',null,H(it.p))); if(it.blocks) blocks(it.blocks,sl); }
    track.append(sl); return sl;
  });
  const nav=el('div','car-nav');
  const prev=el('button','btn ghost small','Previous'), next=el('button','btn ghost small','Next');
  const dots=el('div','car-dots'), count=el('span','count');
  const dotBtns=c.items.map((_,i)=>{ const d=el('button'); d.setAttribute('aria-label','Show '+(i+1)+' of '+n); d.onclick=()=>go(i); dots.append(d); return d; });
  let cur=0;
  const go=i=>{
    cur=Math.max(0,Math.min(n-1,i));
    slides.forEach((sl,j)=>{ sl.classList.toggle('on',j===cur); sl.setAttribute('aria-hidden',j!==cur); });
    dotBtns.forEach((d,j)=>d.setAttribute('aria-current',j===cur));
    prev.disabled=cur===0; next.disabled=cur===n-1; count.textContent=(cur+1)+' of '+n;
  };
  prev.onclick=()=>go(cur-1); next.onclick=()=>go(cur+1);
  nav.append(prev,dots,count,next); wrap.append(track,nav); go(0);
  return wrap;
}
/* Click-to-reveal comes in two forms. String items are revealed in order with
   one button ("Reveal the first", "Reveal the next"). Items given as
   {t, d} (or {t, blocks}) show every term at once; selecting a term opens its
   explanation beneath it, in any order (Module 5's listening blocks, and the
   questions in How framing changes the answer). */
function termsEl(r){

  r.items.forEach(it=>{
    const w=el('div','rv term');
    const did=uid('rvd');

    b.type='button'; b.setAttribute('aria-expanded','false'); b.setAttribute('aria-controls',did);
    const body=el('div','rv-d'); body.id=did;
    if(it.blocks) blocks(it.blocks, body); else body.append(el('p',null,H(it.d)));
    b.onclick=()=>{ const on=w.classList.toggle('on'); b.setAttribute('aria-expanded',on); };
    w.append(b,body); list.append(w);

}
function revealEl(r){
  if(r.items.length && typeof r.items[0]==='object') return termsEl(r);
  const wrap=el('div'), list=el('div','reveal-list'), row=el('div');
  row.style.margin='0 0 1rem';

    list.append(el('div','rv','<span class="d"></span><span>'+H(r.items[i])+'</span>')); i++;
    if(i>=r.items.length) row.remove(); else btn.textContent=r.more||'Reveal the next';
  };
  row.append(btn); wrap.append(list,row); return wrap;
}
function writingEl(cfg){
  const wrap=el('div');
  const form=el('div','reflect'); const vals=cfg.prompts.map(()=>'');
  cfg.prompts.forEach((t,i)=>{
    const f=el('div','field','<label for="'+cfg.id+i+'">'+(cfg.numbered?(i+1)+'. ':'')+H(t)+(cfg.numbered?'':':')+'</label>');
    const ta=el('textarea'); ta.id=cfg.id+i; ta.placeholder=cfg.placeholder||'Your answer';
    ta.oninput=e=>vals[i]=e.target.value;
    f.append(ta); form.append(f);
  });
  wrap.append(form);
  const row=el('div'); row.style.cssText='display:flex;gap:.8rem;align-items:center;flex-wrap:wrap';
  const show=el('button','btn yellow small',cfg.cta||'Submit');
  const copy=el('button','btn ghost small','Copy my answers');
  const said=el('span','eyebrow'); said.style.margin='0';
  const slot=el('div');
  show.onclick=()=>{
    slot.innerHTML='';
    /* `plainFeedback` renders the feedback blocks as ordinary content instead
       of inside a feedback box — for an annotated exchange revealed on submit. */
    const fb=el('div', cfg.plainFeedback?null:'fb info'); fb.setAttribute('role','status');
    if(cfg.plainFeedback) fb.style.marginTop='1.4rem';
    if(cfg.feedback) fb.innerHTML=cfg.feedback;
    if(cfg.feedbackBlocks) blocks(cfg.feedbackBlocks, fb);
    slot.append(fb); focusTo(fb); show.remove();
    if(cfg.onShow) cfg.onShow();
    if(cfg.after||cfg.plainFeedback) reveal(fb,'start');
  };
  copy.onclick=async()=>{
    const txt=cfg.prompts.map((p,i)=>(cfg.numbered?(i+1)+'. ':'')+p+'\n'+(vals[i]||'')).join('\n\n');

    catch(e){ said.textContent='Copying is blocked here — select and copy manually'; }

  if(cfg.after){ const a=el('div'); a.style.marginTop='1.4rem'; blocks(cfg.after,a); wrap.append(a); }
  wrap.append(slot);
  return wrap;

/* Only one recording plays at a time. Starting a clip stops any other, and
   changing page stops everything. */
const PLAYERS=new Set();
function stopAudio(except){ PLAYERS.forEach(p=>{ if(p!==except) p.stop(); }); }

/* ---------- write your own response first ---------- */
/* A short writing step inside a vignette: the learner drafts a first response
   before the options appear. The text is kept in `store` so the response step
   can set it beside the strongest option once a choice has been made. */
function writeStepEl(cfg, store, onDone){
  const wrap=el('div');
  const pid=uid('wp'), hid=uid('wh');
  const q=el('div','check writestep','<p class="prompt" id="'+pid+'">'+H(cfg.prompt)+'</p>'+
    (cfg.hint?'<p class="hint" id="'+hid+'">'+H(cfg.hint)+'</p>':''));
  const ta=el('textarea'); ta.id='vw'+(writeSeq++);
  ta.placeholder=cfg.placeholder||'Your response';
  ta.setAttribute('aria-labelledby', pid); if(cfg.hint) ta.setAttribute('aria-describedby', hid);
  ta.oninput=e=>{ store.text=e.target.value; };
  q.append(ta);
  const btn=el('button','btn yellow small', cfg.cta||'Save my response');
  btn.style.marginTop='.9rem';
  const slot=el('div');
  btn.onclick=()=>{
    btn.remove(); ta.readOnly=true;
    const fb=el('div','fb info');
    fb.append(el('p',null,H(cfg.feedback)));
    slot.append(fb);
    if(onDone) onDone();
    focusTo(fb);
  };
  q.append(btn); wrap.append(q, slot);
  return wrap;
}

function audioEl(cfg){
  const srcs=[].concat(cfg.src||[]).filter(Boolean);
  const w=el('div','audio'+(srcs.length?' live':'')+(cfg.big?' big':''));
  w.innerHTML='<div class="bar">'+(srcs.length?'<button class="play" type="button" aria-label="Play: '+cfg.label+'"></button>':'<span class="play" aria-hidden="true"></span>')+
    '<div class="meta"><span class="ttl">'+cfg.label+'</span>'+
    '<span class="sub">'+(srcs.length?'Audio':'Audio to be added')+'</span></div>'+
    '<div class="wave" aria-hidden="true">'+Array.from({length:38},(_,i)=>'<span style="height:'+(18+Math.abs(Math.sin(i*1.15))*62)+'%"></span>').join('')+'</div></div>';
  if(srcs.length){
    /* A real recording: the play button and the bars work as a small player.
       `src` is a data URI or URL, or a list of them played in order as one
       exchange (the responder's line, then the caller's reply) with a short
       gap between clips (`gap`, in seconds). The bars and the clock run
       across the whole list. One audio element plays every clip in turn, so a
       phone that allowed the first clip also allows the rest. `onEnd` runs
       when the last clip finishes. */
    const a=new Audio(); a.preload='auto';
    const gap=(cfg.gap ?? 0.4)*1000;
    const play=w.querySelector('.play'), sub=w.querySelector('.sub'),
          bars=[...w.querySelectorAll('.wave span')], wave=w.querySelector('.wave');
    const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
    const durs=srcs.map(()=>0);
    let idx=0, loaded=-1, playing=false, timer=null;
    srcs.forEach((x,i)=>{ const m=new Audio(); m.preload='metadata';
      m.addEventListener('loadedmetadata',()=>{ durs[i]=m.duration||0; if(!playing) paint(); }); m.src=x; });
    const total=()=>durs.reduce((p,q)=>p+q,0);
    const elapsed=()=>durs.slice(0,idx).reduce((p,q)=>p+q,0)+(loaded===idx?(a.currentTime||0):0);
    const paint=()=>{
      const T=total(), e=Math.min(elapsed(),T), f=T?e/T:0;
      bars.forEach((b,i)=>b.classList.toggle('on', i/bars.length<f));
      sub.textContent=(playing||e>0) ? fmt(e)+' / '+fmt(T) : fmt(T);
      wave.setAttribute('aria-valuemax', Math.round(T)); wave.setAttribute('aria-valuenow', Math.round(e));
      wave.setAttribute('aria-valuetext', fmt(e)+' of '+fmt(T));
    };
    const setPlaying=on=>{ playing=on; play.classList.toggle('pause',on); play.setAttribute('aria-label', (on?'Pause: ':'Play: ')+cfg.label); };
    /* The bars are a seek slider: click, or arrow keys for 5 seconds. */
    wave.removeAttribute('aria-hidden'); wave.tabIndex=0; wave.setAttribute('role','slider');
    wave.setAttribute('aria-label','Position in '+cfg.label); wave.setAttribute('aria-valuemin','0');
    const go=(t)=>{
      const run=()=>{ if(t!=null) a.currentTime=t; if(playing){ const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{ setPlaying(false); paint(); }); } };
      if(loaded!==idx){ loaded=idx; a.src=srcs[idx]; a.addEventListener('loadedmetadata',run,{once:true}); a.load(); }
      else run();
    };
    const stop=()=>{ clearTimeout(timer); timer=null; a.pause(); setPlaying(false); };
    a.addEventListener('timeupdate',paint);
    a.addEventListener('ended',()=>{
      if(idx<srcs.length-1){
        idx++; paint();
        timer=setTimeout(()=>{ timer=null; if(playing) go(0); }, gap);
      } else {
        stop(); idx=0; loaded=-1; bars.forEach(b=>b.classList.remove('on')); sub.textContent=fmt(total());
        if(cfg.onEnd) cfg.onEnd();
      }
    });
    const player={
      stop:()=>{ if(playing){ stop(); paint(); } },
      play:()=>{ stopAudio(player); setPlaying(true); go(null); }
    };
    PLAYERS.add(player); w._player=player;
    play.onclick=()=>{ if(playing){ stop(); paint(); } else player.play(); };
    const seek=t=>{
      const T=total(); if(!T) return;
      t=Math.max(0, Math.min(t, T-0.25));
      clearTimeout(timer); timer=null;
      let i=0; while(i<srcs.length-1 && t>=durs[i]){ t-=durs[i]; i++; }
      if(i!==idx) a.pause();
      idx=i; go(t); paint();
    };
    wave.onclick=e=>{ const r=wave.getBoundingClientRect(); seek(((e.clientX-r.left)/r.width)*total()); };
    wave.onkeydown=e=>{
      const step={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5,PageUp:15,PageDown:-15}[e.key];
      if(step!=null){ e.preventDefault(); seek(elapsed()+step); }
      else if(e.key==='Home'){ e.preventDefault(); seek(0); }
      else if(e.key==='End'){ e.preventDefault(); seek(total()); }
    };
  }
  if(!cfg.transcript) return w;
  const btn=el('button','transbtn', (cfg.open?'Hide transcript':'Show transcript'));
  const slot=el('div'); slot.id=uid('tr'); btn.setAttribute('aria-controls', slot.id);
  slot.style.display = cfg.open ? '' : 'none';
  slot.append(cfg.transcript);
  let opened=false;
  btn.onclick=()=>{
    const on = slot.style.display==='none';
    slot.style.display = on ? '' : 'none';
    btn.textContent = on ? 'Hide transcript' : 'Show transcript';
    btn.setAttribute('aria-expanded', on);
    if(on && !opened){ opened=true; if(cfg.onTranscript) cfg.onTranscript(); }
  };
  btn.setAttribute('aria-expanded', !!cfg.open);
  w.append(btn, slot);
  return w;
}

/* Text timestamps. A thread, convo or respond given `startTime:'8:12 PM'` runs a
   clock, and each line may carry `wait` (minutes since the previous line).
   Delays in a text exchange are shown this way rather than as stage
   directions; lines without `wait` land in the same minute. */
function clockFrom(start){
  if(!start) return null;
  const m=String(start).match(/(\d+):(\d+)\s*(AM|PM)/i);
  return {m:(+m[1]%12 + (/pm/i.test(m[3])?12:0))*60 + +m[2]};
}
function fmtClock(m){
  m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60;
  return ((h%12)||12)+':'+String(mm).padStart(2,'0')+' '+(h<12?'AM':'PM');
}
function stampLines(lines, clock){
  if(!clock) return lines;
  return lines.map(l=>{ clock.m+=(l.wait||0); return l.sys?l:{...l, time:fmtClock(clock.m)}; });
}
function threadEl(t){
  const isText = t.ch==='Text';
  const w=el('div','thread', t.noCh?'':'<p class="ch">'+(isText?'Text conversation':'Voice call')+'</p>');
  stampLines(t.lines, clockFrom(t.startTime)).forEach(l=>w.append(lineEl(l,isText)));
  return w;
}
function lineEl(l, isText){
  if(l.sys){
    const wrap=el('div');
    if(l.typing){ const ty=el('div','typing','<i></i><i></i><i></i>'); ty.setAttribute('aria-hidden','true'); wrap.append(ty); }
    const sl=el('p','sysline','('+l.sys+')');
    wrap.append(sl);
    /* A stage direction can carry an annotation too (Module 5's purposeful
       silence): wrap the words in <mark> as on a spoken line. */
    if(l.ann) annotate(wrap, sl, l, ' sys');
    return wrap;
  }
  const bubble = isText
    ? el('div','bubble '+(l.who==='us'?'us':'them'),
        (l.time ? '<span class="bh"><span class="spk">'+(l.spk||'')+'</span><span class="sr-only"> at </span><time class="ts">'+l.time+'</time></span><span class="sr-only">: </span>'
                : '<span class="spk">'+(l.spk||'')+'</span><span class="sr-only">: </span>')+H(l.t))
    : el('div','line','<span class="spk">'+(l.spk||'')+'</span><span class="sr-only">: </span>'+(l.meta?'<span class="meta">'+l.meta+' </span>':'')+H(l.t));
  /* In a text thread, `meta` is a timing or delivery cue ("(two minutes
     pass)") and sits on its own line above the message it describes. */
  let node=bubble;
  if(isText && l.meta){ node=el('div'); node.append(el('p','sysline',H(l.meta)), bubble); }
  if(!l.ann) return node;
  const wrap=el('div'); wrap.append(node);
  annotate(wrap, bubble, l, '');
  return wrap;
}
/* Annotations sit under their line, hidden to start. Each <mark> in the
   line toggles its own annotation (the nth mark opens the nth one); a line
   with no marks is revealed by a `write` screen with `annotate:true`. */
function annotate(wrap, host, l, extra){
  const anns=[].concat(l.ann), labels=[].concat(l.annLabel||'Annotation');
  const boxes=anns.map((a,i)=>{ const b=el('div','ann'+extra,
    (labels[i%labels.length]?'<span class="spk">'+labels[i%labels.length]+'</span>':'')+H(a)); b.id=uid('ann'); wrap.append(b); return b; });
  host.querySelectorAll('mark').forEach((m,i)=>{
    const box=boxes[Math.min(i,boxes.length-1)];
    m.setAttribute('role','button'); m.tabIndex=0; m.setAttribute('aria-expanded','false'); m.setAttribute('aria-controls',box.id);
    const flip=()=>{ const on=box.classList.toggle('on'); m.classList.toggle('on',on); m.setAttribute('aria-expanded',on); };
    m.onclick=flip; m.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
  });
}

/* ---------- table ---------- */
/* `cols` are the column headings; the first is the row-label column and may be
   empty. Each row is [label, cell, cell, …]. Below 720px the headings are
   dropped and each cell carries its column name as a small label. */
function tableEl(t){
  const outer=el('div');
  const w=el('div','tbl');
  const head='<thead><tr>'+t.cols.map(c=>'<th scope="col">'+H(c)+'</th>').join('')+'</tr></thead>';
  const rowHtml=r=>'<tr>'+r.map((cell,i)=>
    i===0 ? '<th scope="row">'+H(cell)+'</th>'
          : '<td data-lbl="'+(t.cols[i]||'')+'">'+H(cell)+'</td>'
  ).join('')+'</tr>';

  /* revealRows: the table starts empty and fills a row at a time */
  if(t.revealRows){
    w.innerHTML='<table>'+head+'<tbody></tbody></table>';
    const body=w.querySelector('tbody');
    const row=el('div'); row.style.margin='0 0 1rem';
    const btn=el('button','btn yellow small', t.revealCta||'Reveal the first row');
    let i=0;
    btn.onclick=()=>{
      body.insertAdjacentHTML('beforeend', rowHtml(t.rows[i])); i++;
      if(i>=t.rows.length) row.remove(); else btn.textContent=t.revealMore||'Reveal the next';
    };
    row.append(btn); outer.append(w,row);
    return outer;
  }

  w.innerHTML='<table>'+head+'<tbody>'+t.rows.map(rowHtml).join('')+'</tbody></table>';
  outer.append(w);
  return outer;
}

/* The responder's line that a chosen option adds to the exchange. By default
   it is the option text without its quotation marks. An option that describes
   an action rather than words ("Stay quiet and give her time to continue")
   sets `say`: the words actually spoken, or '' for no responder line. */
function responderLine(o){
  const t = (o.say!==undefined) ? o.say : o.t.replace(/^"|"$/g,'');
  return t ? [{who:'us', spk:'Responder', wait:o.wait, t}] : [];
}

/* ---------- branching conversation ---------- */
/* Runs a scenario as a state machine. Each node contributes its own lines to a
   running transcript, then offers a choice; every option names the node it
   leads to, so learners on different paths see different conversations. Nodes
   without options are scripted beats that continue to `next`; nodes with
   `done` end the scenario. Only the path taken is shown.
   An option marked `deferFb` holds its node's feedback back until after the
   beat it leads to, so a recovery exchange plays before the teaching point. */
function convoEl(cfg){
  const wrap=el('div');
  const stream=el('div');
  const foot=el('div');
  wrap.append(stream, foot);
  const isText = cfg.ch==='Text';
  let said=false, pending=null, clock=clockFrom(cfg.startTime);

  /* Voice scenarios stay audio-first: each exchange gets its own placeholder,
     with the transcript collapsed unless the scenario asks for it open. */
  const turnEl=(lines,label)=>{
    const th=threadEl({ch:cfg.ch, noCh:said||cfg.audio, lines:stampLines(lines, clock)});
    if(!cfg.audio) return th;
    return audioEl({label:label||'The call continues', open:cfg.transcripts==='open', transcript:th});
  };

  const fbEl=(src)=>{
    if(!src || (!src.fb && !src.fbBlocks)) return;
    const fb=el('div','fb info'); fb.setAttribute('role','status');
    if(src.fb) fb.append(el('p',null,H(src.fb)));
    if(src.fbBlocks) blocks(src.fbBlocks, fb);
    stream.append(fb);
  };

  const runNode=(id)=>{
    const n=cfg.nodes[id];
    if(!n) return;
    if(n.blocks) blocks(n.blocks, stream);
    if(n.lines && n.lines.length){ stream.append(turnEl(n.lines, n.audioLabel)); said=true; }
    if(pending){ fbEl(pending); pending=null; }

    if(n.done){
      if(cfg.restart){
        const again=el('button','btn ghost small', cfg.restart);
        again.onclick=()=>{ stream.innerHTML=''; foot.innerHTML=''; said=false; pending=null; clock=clockFrom(cfg.startTime); runNode(cfg.start); };
        foot.innerHTML=''; foot.append(again);
      }
      return;
    }

    if(!n.options){
      const on=el('button','btn yellow small', n.cta||'Continue the call');
      on.style.margin='0 0 1rem';
      on.onclick=()=>{ on.remove(); runNode(n.next); };
      stream.append(on);
      return;
    }

    /* `ask` puts the question on its own line beneath a scenario prompt, as
       on mcq screens. */
    const q=el('div','check','<p class="prompt'+(n.ask?' scenario':'')+'">'+H(n.prompt)+'</p>'+
      (n.ask?'<p class="prompt ask">'+H(n.ask)+'</p>':'')+
      (n.hint?'<p class="hint">'+H(n.hint)+'</p>':''));
    const list=el('div','opts'); q.append(list);
    stream.append(q);

    n.options.forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      b.onclick=()=>{
        list.querySelectorAll('button').forEach(x=>{
          x.disabled=true;
          if(x!==b) x.dataset.outcome='dim';
        });
        b.dataset.picked='1';
        const turn=responderLine(o)
          .concat((o.reply||[]).map(r=>({...r, who:'them'})));
        stream.append(turnEl(turn, cfg.audioLabel||'Your response and what follows'));
        said=true;
        if(o.deferFb) pending={fb:n.fb, fbBlocks:n.fbBlocks};
        else fbEl(n);
        const on=el('button','btn yellow small', o.cta||'Continue the call');
        on.style.margin='.9rem 0 1rem';
        on.onclick=()=>{ on.remove(); runNode(o.next); };
        stream.append(on);
      };
      list.append(b);
    });
  };

  runNode(cfg.start);
  return wrap;
}

/* ---------- response step ---------- */
/* One "choose what you would say" step: options, the reply each one draws,
   and a shared closing note once a response has been chosen. Used on its own
   (`respond` screens) and as step 2 of a vignette. */
function respondEl(cfg, isText){
  const wrap=el('div');
  const q=el('div','check','<p class="prompt">'+H(cfg.prompt)+'</p>'+
    (cfg.hint?'<p class="hint">'+H(cfg.hint)+'</p>':''));
  const list=el('div','opts'); q.append(list);
  const out=el('div'), closing=el('div');
  /* `feedbackCta` holds the closing feedback behind a button, so the learner
     sees how the response lands before reading why. Once opened it stays open
     for the other options. */
  let chosen=null, tried=[], fbOpen=!cfg.feedbackCta;
  /* Focus follows the learner: to the reply (its Play button, or the thread)
     after a choice, to the options after "Try another response", and to the
     feedback after "Show the feedback". */
  /* (A placeholder recording has no Play button and its transcript is closed,
     so focus goes to the recording block itself.) */
  const focusReply=()=>focusTo(out.querySelector('button.play')||(isText&&out.querySelector('.thread'))||out.firstChild);
  const paint=()=>{
    /* a response being replaced stops talking */
    out.querySelectorAll('.audio').forEach(a=>a._player&&a._player.stop());
    list.innerHTML=''; out.innerHTML=''; closing.innerHTML='';
    cfg.options.filter(o=>!chosen||o.k===chosen).forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      if(chosen){ b.disabled=true; b.dataset.picked='1'; }
      b.onclick=()=>{ chosen=o.k; tried.push(o.k); paint(); focusReply(); };
      list.append(b);
    });
    if(chosen){
      const o=cfg.options.find(x=>x.k===chosen);
      const cont=el('div','thread','<p class="ch">'+(isText?'How the thread continues':'How the call continues')+'</p>');
      stampLines(responderLine(o)
        .concat(o.reply.map(r=>({...r,who:'them'}))), clockFrom(cfg.startTime))
        .forEach(l=>cont.append(lineEl(l,isText)));
      if(isText) out.append(cont);
      else out.append(audioEl({label:cfg.audioLabel||'Your response and what follows', src:o.audio, transcript:cont}));
      const hasFb = !!(cfg.compare || cfg.closing || cfg.closingBlocks);
      const rest=()=>{
      if(tried.length<cfg.options.length){
        const again=el('button','btn yellow small', cfg.againLabel||'Try another response');
        again.style.margin='0 0 1rem'; again.onclick=()=>{ chosen=null; paint(); focusTo(list.querySelector('.opt')); };
        out.append(again);
      }
      if(hasFb){
        const fb=el('div','fb info'); fb.setAttribute('role','status');
        /* Where the learner drafted a response first, it is set beside the
           strongest option before the closing note. */
        if(cfg.compare){
          const best=cfg.options.find(x=>x.k===cfg.compare.best);
          const mine=(cfg.compare.store.text||'').trim();
          fb.append(el('div','compare',
            '<div class="side"><span class="lbl">What you wrote</span>'+
            (mine ? '<p>'+ESC(mine)+'</p>' : '<p class="none">You moved on without writing a response.</p>')+'</div>'+
            '<div class="side best"><span class="lbl">The strongest response</span><p>'+H(best.t.replace(/^"|"$/g,''))+'</p></div>'));
        }
        if(cfg.closing) fb.append(el('p',null,H(cfg.closing)));
        if(cfg.closingBlocks) blocks(cfg.closingBlocks, fb);
        closing.append(fb);
      }
      };
      if(hasFb && !fbOpen){
        const see=el('button','btn yellow small', cfg.feedbackCta);
        see.style.margin='0 0 1rem';
        see.onclick=()=>{ fbOpen=true; see.remove(); rest(); focusTo(closing.firstChild); };
        out.append(see);
      } else rest();
      if(cfg.onChoose) cfg.onChoose(chosen);
    }
  };
  paint();
  wrap.append(q,out,closing);
  return wrap;
}

/* ---------- immersive scenario ---------- */
/* An opt-in way of running a vignette: `immersive:true` on the vignette, or
   `immersive:true` in META for a whole module. One stage shows at a time. The
   call plays on its own (or the messages arrive one by one) and the first
   question appears when it has finished. After a response is chosen, the reply
   plays and the feedback appears when it ends. Finished stages fold into a
   short trail above the current one, so the opening can be replayed and the
   learner can see what they chose. Opening a transcript offers a Continue
   button, so nobody has to listen to move on. */
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Bring a node into view. An embedded piece scrolls only its own document,
   never the page it is embedded in. */
function reveal(node, block){
  if(!node.isConnected) return;
  if(META.embed){
    const r=node.getBoundingClientRect();
    if(block==='nearest' && r.top>=0 && r.bottom<=innerHeight) return;
    window.scrollTo({top:Math.max(0, r.top+window.scrollY-8), behavior:REDUCED?'auto':'smooth'});
    return;
  }
  node.scrollIntoView({behavior:REDUCED?'auto':'smooth', block:block||'start'});
}

/* Text messages arriving one at a time, with a typing indicator before each
   message from the other person and a longer pause where the clock jumps.
   `skip()` shows the rest at once. */
function typeLines(box, lines, isText, done){
  let i=0, timer=null, finished=false, pending=null, current=null;
  /* Screen readers read each message as it arrives. */
  box.setAttribute('role','log'); box.setAttribute('aria-live','polite');
  const end=()=>{ if(finished) return; finished=true; if(done) done(); };
  const put=l=>{ current=null; const n=lineEl(l,isText); if(!REDUCED) n.classList.add('imm-in'); box.append(n); };
  const next=()=>{
    if(i>=lines.length){ end(); return; }
    const l=current=lines[i++];
    if(REDUCED){ put(l); next(); return; }
    const pause = l.wait ? 1100 : 0;
    if(!l.sys && l.who!=='us'){
      timer=setTimeout(()=>{
        pending=el('div','typing pending','<i></i><i></i><i></i>'); pending.setAttribute('aria-hidden','true'); box.append(pending);
        timer=setTimeout(()=>{ pending.remove(); pending=null; put(l); timer=setTimeout(next, 450); },
          Math.min(2200, 650 + String(l.t).length*14));
      }, pause);
    } else {
      timer=setTimeout(()=>{ put(l); timer=setTimeout(next, l.sys?1100:550); }, pause);
    }
  };
  next();
  return {skip:()=>{ clearTimeout(timer); if(pending){ pending.remove(); pending=null; }
    /* a message caught mid-typing still has to land */
    if(current) box.append(lineEl(current,isText)); current=null;
    while(i<lines.length) box.append(lineEl(lines[i++],isText)); end(); }};
}

function immersiveEl(s, onComplete){
  const isText=s.thread.ch==='Text', name=s.person.name;
  /* An embed has no screen title, so the person's name is its h2. */
  const HL=META.embed?2:3;
  const v=el('div','vig imm');
  v.append(el('div','vig-head','<div class="avatar" aria-hidden="true">'+s.person.init+'</div>'+
    '<div><h'+HL+' class="nm">'+name+'</h'+HL+'><span class="sub">'+SUB(s.person.sub)+'</span></div>'+
    '<span class="chip'+(isText?' blue':'')+'" style="display:none"><span class="sr-only">Presentation: </span>'+s.person.tag+'</span>'));
  const trail=el('div','imm-trail'), stage=el('div','imm-stage');
  v.append(trail, stage);
  const store={text:''};
  const parts=[]; if(s.step1) parts.push('need'); if(s.write) parts.push('write'); parts.push('respond');
  const labels={need:'What might '+name+' need first?', write:'Write your own first response', respond:'Choose your first response'};
  const showTag=()=>{ const c=v.querySelector('.chip'); if(c.style.display==='none'){ c.style.display=''; announce('Presentation: '+s.person.tag); } };
  const instr=t=>el('p','instr','<em>'+H(t)+'</em>');
  /* Each new stage takes focus at its first heading or line, or at `target`. */
  const enter=target=>{ if(!REDUCED) stage.classList.remove('imm-in'), void stage.offsetWidth, stage.classList.add('imm-in');
    requestAnimationFrame(()=>{ reveal(stage,'start'); focusTo(target || stage.querySelector('.step,.instr,.prompt')); }); };
  /* A finished step folds into the trail. A question step keeps the full
     question and its feedback behind a Review button, read only. */
  const done=(label, html, full)=>{
    const d=el('div','imm-done','<span class="lbl">'+H(label)+'</span>'+html);
    if(full){
      full.querySelectorAll('.fb .btn').forEach(b=>b.remove());
      full.querySelectorAll('[tabindex="-1"]').forEach(n=>n.removeAttribute('tabindex'));
      const box=el('div','imm-review'); box.id=uid('rv'); box.hidden=true; box.append(full);
      const b=el('button','transbtn imm-review-btn','Review this question');
      b.setAttribute('aria-expanded','false'); b.setAttribute('aria-controls',box.id);
      b.onclick=()=>{ box.hidden=!box.hidden; b.setAttribute('aria-expanded',!box.hidden); b.textContent=box.hidden?'Review this question':'Hide this question'; };
      d.append(b, box);
    }
    trail.append(d); };
  const nextBtn=(label, fn)=>{ const row=el('div','imm-next'); const b=el('button','btn yellow small',label); b.onclick=()=>{ row.remove(); fn(); }; row.append(b); return row; };
  const stepHead=i=> parts.length>1 ? el('h'+(HL+1),'step','<span class="n" aria-hidden="true">'+(i+1)+'</span><span class="sr-only">Step '+(i+1)+' of '+parts.length+': </span>'+labels[parts[i]]) : null;
  const run=i=>{ const p=parts[i]; stage.innerHTML=''; if(p==='need') need(i); else if(p==='write') write(i); else respond(i); };

  /* Stage 0: the opening, on its own */
  const opening=()=>{
    let moved=false;
    const advance=()=>{ if(moved) return; moved=true;
      /* moving a node replays its entry animation; clear it so the thread does not flicker */
      if(isText){ th.querySelectorAll('.imm-in').forEach(x=>x.classList.remove('imm-in')); trail.append(th); }
      else { player.classList.remove('big'); trail.append(player); }
      run(0); enter(); };
    let th, player;
    if(isText){
      stage.append(instr('Read the messages as they arrive.'));
      th=el('div','thread','<p class="ch">Text conversation</p>'); stage.append(th);
      const skipRow=el('div','imm-next'); const skip=el('button','btn ghost small','Show all messages'); skipRow.append(skip); stage.append(skipRow);
      const t=typeLines(th, stampLines(s.thread.lines, clockFrom(s.thread.startTime)), true,
        ()=>{ const had=skipRow.contains(document.activeElement); skipRow.remove(); if(had) focusTo(th.querySelector('.ch')); setTimeout(advance, REDUCED?0:700); });
      skip.onclick=()=>t.skip();
    } else {
      stage.append(instr('Listen to the opening moments of the call. The next step appears when it ends.'));
      let cont=null;
      player=audioEl({label:'Opening moments of the call', src:s.audio, big:true, transcript:threadEl(s.thread),
        onEnd:()=>{ if(cont) cont.remove(); advance(); },
        onTranscript:()=>{ if(!moved && !cont){ cont=nextBtn('Continue', advance); stage.append(cont); } }});
      stage.append(player);
      if(!s.audio){ cont=nextBtn('Continue', advance); stage.append(cont); }
    }
  };

  /* Stage: what might the person need */
  const need=i=>{
    const h=stepHead(i); if(h) stage.append(h);
    let shown=false;
    const q=questionEl({...s.step1}, {onCorrect:()=>{
      showTag(); if(shown) return; shown=true;
      stage.append(nextBtn('Continue', ()=>{
        const right=s.step1.options.find(o=>o.correct);
        done(labels.need, H(right.t), q); run(i+1); enter(); }));
    }});
    stage.append(q);
  };

  /* Stage: the learner's own first response */
  const write=i=>{
    const h=stepHead(i); if(h) stage.append(h);
    stage.append(writeStepEl(s.write, store, ()=>{
      stage.append(nextBtn('Continue', ()=>{
        const mine=(store.text||'').trim();
        done('Your first response', mine?ESC(mine):'<em>You moved on without writing a response.</em>');
        run(i+1); enter(); }));
    }));
  };

  /* Stage: choose a response, hear or read the reply, then the feedback */
  const respond=i=>{
    const st=s.step2, tried=new Set();
    const h=stepHead(i); if(h) stage.append(h);
    const q=el('div','check','<p class="prompt">'+H(st.prompt)+'</p>'+(st.hint?'<p class="hint">'+H(st.hint)+'</p>':''));
    const list=el('div','opts'); q.append(list);
    const out=el('div');
    stage.append(q, out);
    const quiet=()=>out.querySelectorAll('.audio').forEach(a=>a._player&&a._player.stop());
    const options=()=>{
      quiet(); out.innerHTML=''; q.style.display=''; list.innerHTML='';
      st.options.forEach(o=>{
        const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>'+(tried.has(o.k)?'<span class="tried">Tried</span>':''));
        b.onclick=()=>choose(o); list.append(b);
      });
    };
    const choose=o=>{
      tried.add(o.k); q.style.display='none'; quiet(); out.innerHTML='';
      let finished=false, target=null;
      const finish=()=>{
        if(finished) return; finished=true;
        if(!s.step1) showTag();
        /* the reply has been heard: its player steps back so the feedback leads */
        out.querySelectorAll('.audio.big').forEach(a=>a.classList.remove('big'));
        const fb=el('div','fb info'+(REDUCED?'':' imm-in'));
        if(s.write){
          const best=st.options.find(x=>x.k===s.write.best), mine=(store.text||'').trim();
          fb.append(el('div','compare','<div class="side"><span class="lbl">What you wrote</span>'+
            (mine?'<p>'+ESC(mine)+'</p>':'<p class="none">You moved on without writing a response.</p>')+'</div>'+
            '<div class="side best"><span class="lbl">The strongest response</span><p>'+H(best.t.replace(/^"|"$/g,''))+'</p></div>'));
        }
        if(st.closing) fb.append(el('p',null,H(st.closing)));
        if(st.closingBlocks) blocks(st.closingBlocks, fb);
        out.append(fb);
        if(onComplete) onComplete();
        if(tried.size<st.options.length) out.append(nextBtn(st.againLabel||'Try another response', ()=>{ options(); enter(q.querySelector('.prompt')); }));
        requestAnimationFrame(()=>{ reveal(fb,'nearest'); focusTo(fb); });
      };
      const said=o.t.replace(/^"|"$/g,'');
      if(isText){
        const th=el('div','thread','<p class="ch">How the thread continues</p>'); out.append(th);
        const lines=stampLines([{who:'us',spk:'Responder',wait:o.wait,t:said}].concat(o.reply.map(r=>({...r,who:'them'}))), clockFrom(st.startTime));
        const skipRow=el('div','imm-next'); const skip=el('button','btn ghost small','Show all messages'); skipRow.append(skip); out.append(skipRow);
        const t=typeLines(th, lines, true, ()=>{ const had=skipRow.contains(document.activeElement); skipRow.remove(); if(had) focusTo(th.querySelector('.ch')); setTimeout(finish, REDUCED?0:600); });
        skip.onclick=()=>t.skip();
        target=th.querySelector('.ch');
      } else {
        out.append(el('div','imm-said','<span class="lbl">Your response</span>'+H(said)));
        out.append(instr('Listen to how '+name+' responds.'));
        let cont=null;
        const transcript=threadEl({ch:'Voice call', lines:[{who:'us',spk:'Responder',t:said}].concat(o.reply.map(r=>({...r,who:'them'})))});
        const pl=audioEl({label:'Your response and what follows', src:o.audio, big:true, transcript,
          onEnd:()=>{ if(cont) cont.remove(); finish(); },
          onTranscript:()=>{ if(!finished && !cont){ cont=nextBtn('Continue', finish); pl.after(cont); } }});
        out.append(pl);
        /* The reply plays straight away; focus goes to its Pause button, so a
           screen reader user hears that audio is playing and can stop it. */
        if(o.audio && pl._player){ pl._player.play(); target=pl.querySelector('button.play'); }
        else { cont=nextBtn('Continue', finish); out.append(cont); target=out.querySelector('.imm-said'); }
      }
      enter(target);
    };
    options();
  };

  opening();
  return v;
}

/* ---------- knowledge check ---------- */
function questionEl(q, opts){
  const box=el('div','check',
    '<p class="prompt'+(q.ask?' scenario':'')+'">'+H(q.prompt)+'</p>'+
    (q.ask?'<p class="prompt ask">'+H(q.ask)+'</p>':'')+
    (q.hint?'<p class="hint">'+H(q.hint)+'</p>':''));
  const list=el('div','opts'); box.append(list);
  const slot=el('div'); box.append(slot);
  let picked=null;
  const paint=()=>{
    list.innerHTML=''; slot.innerHTML='';
    const gotIt = picked && (q.shared || (q.options.find(o=>o.k===picked)||{}).correct);
    /* Once answered, the options say in words which one was picked and which
       is the best answer, so the result does not rest on colour alone. */
    const showBest = picked && !q.shared && (q.oneFb || gotIt);
    q.options.forEach(o=>{
      const tags=[];
      if(picked===o.k) tags.push('<span class="tag">Your answer</span>');
      if(showBest && o.correct) tags.push('<span class="tag best">Best answer</span>');
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>'+
        (tags.length?'<span class="tags">'+tags.join('')+'</span>':''));
      if(picked){
        b.disabled=true;
        if(picked===o.k) b.dataset.picked='1';
        if(q.shared){ if(q.answerKey===o.k) b.dataset.outcome='info'; else if(picked!==o.k) b.dataset.outcome='dim'; }
        else if(q.oneFb){
          if(o.correct) b.dataset.outcome='correct';
          else if(picked===o.k) b.dataset.outcome='wrong';
          else b.dataset.outcome='dim';
        }
        else if(gotIt){ if(o.correct) b.dataset.outcome='correct'; else b.dataset.outcome='dim'; }
      }
      b.onclick=()=>{ picked=o.k; paint(); if(opts&&opts.onPick) opts.onPick(o.k); if(opts&&opts.onCorrect&&(q.shared||o.correct)) opts.onCorrect(); focusTo(slot.firstChild); };
      list.append(b);
    });
    if(picked){
      const chosen=q.options.find(o=>o.k===picked);
      const fb=el('div');
      const verdict='<span class="verdict">'+(chosen.correct?'Best answer':'Not the best answer')+'</span>';
      if(q.shared){ fb.className='fb info'; fb.innerHTML='<p>'+H(q.sharedFb)+'</p>'; }
      else if(q.oneFb){ fb.className='fb '+(chosen.correct?'yes':'no'); fb.innerHTML=verdict+'<p>'+H(q.oneFb)+'</p>'; }
      else{
        fb.className='fb '+(chosen.correct?'yes':'no');
        fb.innerHTML=verdict+'<p>'+H(chosen.fb)+'</p>';
        /* `explore` offers the other options after the correct one, for a
           storyboard that asks the learner to go back and try them. */
        if(!chosen.correct || q.explore){
          const again=el('button','btn ghost small', chosen.correct?(q.exploreLabel||'Try another response'):'Try again'); again.style.marginTop='.8rem';
          again.onclick=()=>{ picked=null; paint(); focusTo(list.firstChild); };
          fb.append(again);
        }
      }
      slot.append(fb);
    }
  };
  paint();
  return box;
}

/* ---------- pages ---------- */
const stream=$('#stream'), hero=document.querySelector('.hero');
const PAGES = SECTIONS.map((entry,si)=>({
  si,
  name: (typeof entry==='string') ? entry : entry.name,
  /* Continuation pages carry `menu:false` so the contents list stays an
     outline of topics and activities rather than every page. */
  menu: (typeof entry==='string') ? true : entry.menu!==false,
  header: SCREENS.find(s=>s.sec===si && s.type==='section') || null,
  chunks: SCREENS.filter(s=>s.sec===si && s.type!=='section' && s.type!=='cover' && s.type!=='complete')
}));
const TOTAL = PAGES.reduce((n,p)=>n+p.chunks.length,0);
const state = { page:0, revealed: PAGES.map(()=>1), done:false, picks:{} };

function el2(tag,cls,html){ return el(tag,cls,html); }
let writeSeq=0;

function dividerEl(s){
  const d=el('section','divider rev in');
  d.dataset.tone=s.tone||'trust';
  d.innerHTML='<div class="in"><div>'+(s.num?'<p class="num" aria-hidden="true">'+s.num+'</p>':'<div class="rule"></div>')+
    '<p class="kick">'+s.kicker+'</p><h2>'+H(s.title)+'</h2><p class="line">'+H(s.line)+'</p></div>'+
    '<div>'+sectionArt(s.art,s.tone)+'</div></div>';
  return d;
}

function chunkEl(s){
  const d=el('div','blk rev'); const c=el('div','col'); d.append(c);
  if(s.eyebrow) c.append(el('p','eyebrow',s.eyebrow));
  if(s.title) c.append(el('h2',null,H(s.title)));

  if(s.type==='prose'){ blocks(s.blocks,c); return d; }

  if(s.type==='mcq'){
    if(s.intro) blocks(s.intro,c);
    c.append(questionEl(s, s.id ? {onPick:k=>{ state.picks[s.id]=k; }} : undefined));
    return d;
  }

  if(s.type==='vignette' && (s.immersive ?? META.immersive)){
    c.append(immersiveEl(s, ()=>{ if(!COMPLETE.has(s)){ COMPLETE.add(s); document.dispatchEvent(new CustomEvent('screendone',{detail:s})); } }));
    return d;
  }
  if(s.type==='vignette'){
    const isText=s.thread.ch==='Text';
    const v=el('div','vig');
    v.append(el('div','vig-head','<div class="avatar">'+s.person.init+'</div>'+
      '<div><span class="nm">'+s.person.name+'</span><span class="sub">'+s.person.sub+'</span></div>'+
      '<span class="chip'+(isText?' blue':'')+'" style="display:none">'+s.person.tag+'</span>'));
    if(isText) v.append(threadEl(s.thread));
    else v.append(audioEl({label:'Opening moments of the call', src:s.audio, transcript:threadEl(s.thread)}));
    /* A vignette runs the steps the storyboard gives it: a question about what
       the person needs, a draft of the learner's own first response, and the
       response choice. Steps are numbered only where there is more than one,
       and each one unlocks the next. The presentation tag stays hidden until a
       step has been answered, so it does not give the answer away. */
    const store={text:''};
    const parts=[];
    if(s.step1) parts.push('need');
    if(s.write)  parts.push('write');
    parts.push('respond');
    const labels={need:'What might '+s.person.name+' need first?',
                  write:'Write your own first response',
                  respond:'Choose your first response'};
    const showTag=()=>{ v.querySelector('.chip').style.display=''; };
    const boxes=parts.map((p,i)=>{
      const b=el('div', i>0 ? 'locked' : null);
      if(parts.length>1) b.append(el('p','step','<span class="n">'+(i+1)+'</span> '+labels[p]));
      return b;
    });
    const unlock=i=>{ if(boxes[i]) boxes[i].classList.remove('locked'); };
    parts.forEach((p,i)=>{
      if(p==='need'){
        boxes[i].append(questionEl({...s.step1}, {onCorrect:()=>{ unlock(i+1); showTag(); }}));
      } else if(p==='write'){
        boxes[i].append(writeStepEl(s.write, store, ()=>unlock(i+1)));
      } else {
        boxes[i].append(respondEl({...s.step2,
          compare: s.write ? {store, best:s.write.best} : null,
          onChoose: s.step1 ? null : showTag}, isText));
      }
    });
    boxes.forEach(b=>v.append(b));
    c.append(v);
    return d;
  }

  if(s.type==='convo'){
    if(s.intro) blocks(s.intro,c);
    c.append(convoEl(s));
    return d;
  }

  if(s.type==='respond'){
    if(s.intro) blocks(s.intro,c);
    c.append(respondEl(s, s.ch==='Text'));
    return d;
  }

  if(s.type==='write'){
    if(s.intro) blocks(s.intro,c);
    c.append(writingEl({id:'w'+(writeSeq++), prompts:s.prompts, numbered:!!s.numbered,
      placeholder:s.placeholder||'Your answer', cta:s.cta||'Submit',
      feedbackBlocks:s.feedback, prototypeNote:s.prototypeNote, after:s.after, plainFeedback:s.plainFeedback,
      onShow: s.annotate ? ()=>c.querySelectorAll('.ann').forEach(a=>a.classList.add('on')) : null}));
    return d;
  }

  if(s.type==='video'){
    blocks(VIDEO_BLOCKS,c);
    c.append(el('div','video','<div class="frame"><span class="play"></span><span class="lbl">Responder voices &middot; video to be produced</span></div>'));
    return d;
  }

  if(s.type==='reflect'){
    blocks(REFLECT_INTRO,c);
    c.append(writingEl({id:'r', prompts:REFLECT_PROMPTS, numbered:true, cta:'Submit my reflection',
      feedback:'<p>'+H(REFLECT_FEEDBACK)+'</p>'}));
    return d;
  }

  if(s.type==='plan'){
    blocks(PLAN_INTRO,c);
    c.append(writingEl({id:'p', prompts:PLAN_PROMPTS, numbered:false, placeholder:'What would work for you?',
      cta:'Submit my plan',
      feedback:'<p>'+H(PLAN_FEEDBACK)+'</p>'+
        cardsEl({cols:1, tight:true, items:STRATEGIES.map(t=>({t}))}).outerHTML}));
    return d;
  }

  if(s.type==='refs'){ c.append(el('div','refs', REFS.map(r=>'<p>'+r+'</p>').join(''))); return d; }
  return d;
}

function endEl(){
  return el('section','end rev','<div class="sweep"></div><div class="in">'+
    '<p class="eyebrow">'+META.moduleLabel+' complete</p><h2>'+H(END.title)+'</h2>'+
    '<p>'+H(END.summary)+'</p>'+
    '<div class="panel"><h4>'+H(END.nextTitle)+'</h4><p>'+H(END.next)+'</p></div>'+
    '</div>');
}

/* Screens that hold the page's Continue button until they are finished: an
   immersive scenario, until its first reply and feedback have been shown.
   Finished screens are remembered, so revisiting a page does not hold it again. */
const COMPLETE=new Set();
const holdsGate=s=>s && s.type==='vignette' && (s.immersive ?? META.immersive) && !COMPLETE.has(s);

function gateEl(){
  const p=PAGES[state.page], shown=state.revealed[state.page];
  const g=el('div','gate');
  const lastShown=p.chunks[shown-1];
  if(holdsGate(lastShown)){
    g.hidden=true;
    const show=e=>{ if(e.detail!==lastShown) return; document.removeEventListener('screendone',show);
      g.hidden=false; if(!REDUCED) g.classList.add('imm-in'); };
    document.addEventListener('screendone',show);
  }
  const more = shown < p.chunks.length;
  const last = state.page===PAGES.length-1;
  const btn=el('button','btn', more ? 'Continue' : (last ? 'Finish module' : 'Continue to '+PAGES[state.page+1].name));
  btn.onclick=()=>{
    if(more){
      g.remove();
      const node=chunkEl(p.chunks[shown]);
      stream.append(node);
      state.revealed[state.page]=shown+1;
      stream.append(gateEl());
      requestAnimationFrame(()=>{ node.classList.add('in'); node.scrollIntoView({behavior:'smooth',block:'start'}); focusTo(node); });
      progress();
    } else if(last){
      g.remove(); state.done=true;
      const e=endEl(); stream.append(e);
      requestAnimationFrame(()=>{ e.classList.add('in'); e.scrollIntoView({behavior:'smooth',block:'start'}); focusTo(e); });
      progress();
    } else {
      goPage(state.page+1); focusTo(pageStart());
    }
  };
  g.append(btn);
  if(state.page>0 && !more){
    const back=el('button','back','Back to '+PAGES[state.page-1].name);
    back.onclick=()=>{ goPage(state.page-1); focusTo(pageStart()); };
    g.append(back);
  }
  return g;
}

/* Where focus goes when the learner moves to another page: the divider's
   title, or the first screen on a page without one. */
const pageStart=()=>stream.querySelector('.divider h2')||stream.firstElementChild;

function goPage(pi){
  stopAudio();
  state.page=pi;
  stream.innerHTML='';
  hero.style.display = pi===0 ? '' : 'none';
  /* The hero carries the page's h1. Once it is hidden, a visually hidden h1
     with the module title takes its place, so every page has one. */
  if(!META.embed){ const h1=$('#pageH1'); h1.textContent=META.title; h1.hidden = pi===0; }
  const p=PAGES[pi];
  stream.dataset.top = p.header ? 'divider' : (pi===0 ? 'hero' : 'bare');
  if(p.header) stream.append(dividerEl(p.header));
  const shown=state.revealed[pi];
  for(let i=0;i<shown;i++){ const n=chunkEl(p.chunks[i]); n.classList.add('in'); stream.append(n); }
  stream.append(gateEl());
  if(state.done && pi===PAGES.length-1){ const e=endEl(); e.classList.add('in'); stream.append(e); }
  window.scrollTo({top: pi===0 ? 0 : 0, behavior:'auto'});
  buildToc(); progress();
}

/* ---------- contents drawer ---------- */
const toc=$('#toc');
function buildToc(){
  toc.innerHTML='';
  let n=0;
  PAGES.forEach((p,si)=>{
    if(!p.menu) return;
    /* a hidden continuation page counts as still being inside its listed page */
    let last=si; while(last+1<PAGES.length && !PAGES[last+1].menu) last++;
    const complete = state.revealed[last] >= PAGES[last].chunks.length && last < state.page;
    const here = state.page>=si && state.page<=last;
    if(si>0) n++;
    const a=el('a',null,'<span class="n">'+(si===0?'Start':'Part '+n)+(complete?'<span class="tick">&#9679;</span>':'')+'</span>'+p.name);
    a.href='#';
    if(here) a.setAttribute('aria-current','true');
    a.onclick=e=>{ e.preventDefault(); goPage(si); closeDrawer(); focusTo(pageStart()); };
    toc.append(a);
  });
}
const drawer=$('#drawer'), menubtn=$('#menubtn');
function openDrawer(){ drawer.classList.add('on'); menubtn.setAttribute('aria-expanded','true');
  const cur=$('#toc a[aria-current]')||$('#toc a'); if(cur) cur.focus({preventScroll:true}); }
function closeDrawer(){ const had=drawer.contains(document.activeElement);
  drawer.classList.remove('on'); menubtn.setAttribute('aria-expanded','false'); if(had) menubtn.focus(); }
menubtn.onclick=()=>drawer.classList.contains('on')?closeDrawer():openDrawer();
drawer.onclick=e=>{ if(e.target===drawer) closeDrawer(); };
/* Tabbing out of the open contents panel closes it, so focus is never behind the overlay. */
drawer.addEventListener('focusout',e=>{ if(drawer.classList.contains('on') && e.relatedTarget && !drawer.contains(e.relatedTarget) && e.relatedTarget!==menubtn) closeDrawer(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
$('#begin').onclick=()=>{ stream.scrollIntoView({behavior:'smooth',block:'start'}); focusTo(stream.firstElementChild); };

/* ---------- progress ---------- */
const fill=$('#fill'), pct=$('#pct');
function progress(){
  let seen=0;
  PAGES.forEach((p,i)=>{ seen += (i<state.page) ? p.chunks.length : (i===state.page ? state.revealed[i] : 0); });
  const p=Math.min(100, Math.round(seen/TOTAL*100));
  fill.style.width=p+'%'; pct.textContent=p+'%';
}

/* ---------- embedded piece ---------- */
/* An embed (META.embed) shows the screens of its single page one at a time:
   numbered buttons for the scenarios, a Next button that waits for each
   immersive scenario to finish, and a Previous button. Screens already seen
   are kept as they were left, so going back shows the learner's own answers. When the last screen is reached and finished,
   the piece sends its host the completion message Rise code blocks listen for:
   window.parent.postMessage({type:'complete'}, '*'). */
function embedStart(){
  const chunks=PAGES[0].chunks, last=chunks.length-1;
  const scen=chunks.map((c,k)=>c.type==='vignette'?k:-1).filter(k=>k>=0);
  let sent=false, cur=-1, far=0;
  const nodes=[];
  const finish=()=>{ if(sent) return; sent=true; if(window.parent!==window) window.parent.postMessage({type:'complete'},'*'); };
  const isDone=k=>!holdsGate(chunks[k]);
  /* The page heading, for screen readers: the host page shows its own title. */
  document.title=PAGES[0].name+' · '+META.course;
  stream.append(el('h1','sr-only',H(PAGES[0].name)));
  let dots=null, dotBtns=[];
  if(scen.length>1){
    dots=el('nav'); dots.setAttribute('aria-label','Interactions');
    const ol=el('ol','emb-dots'); dots.append(ol);
    dotBtns=scen.map((k,n)=>{ const li=el('li'), b=el('button',null,String(n+1)); b.type='button';
      b.onclick=()=>go(k); li.append(b); ol.append(li); return b; });
    stream.append(dots);
  }
  const slot=el('div'), nav=el('div','emb-nav');
  stream.append(slot, nav);
  const paintDots=()=>{
    dotBtns.forEach((b,n)=>{ const k=scen[n], s=chunks[k], name=s.person?s.person.name:'';
      const done=COMPLETE.has(s);
      b.classList.toggle('done', done);
      b.disabled = k>far;
      if(k===cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
      b.setAttribute('aria-label','Interaction '+(n+1)+(k<=far&&name?', '+name:'')+(done?', completed':k>far?', not started':''));
    });
  };
  const paintNav=()=>{
    nav.innerHTML='';
    if(cur>0){
      const prevScen=chunks[cur-1].type==='vignette';
      const p=el('button','btn ghost prev', prevScen?'Previous interaction':'Back');
      p.onclick=()=>go(cur-1); nav.append(p);
    }
    if(cur<last && isDone(cur)){
      const nextIsScen=chunks[cur+1].type==='vignette';
      const b=el('button','btn', nextIsScen ? 'Continue to the next interaction' : 'Continue to the '+(chunks[cur+1].title||'next part').toLowerCase());
      b.onclick=()=>go(cur+1); nav.append(b);
    }
    if(cur===last && isDone(cur)) finish();
    nav.hidden=!nav.children.length;
  };
  /* An interaction finishing shows the Next button (focus stays where it is). */
  document.addEventListener('screendone',e=>{
    const k=chunks.indexOf(e.detail); if(k<0) return;
    paintDots();
    if(k===cur){ const had=nav.contains(document.activeElement); paintNav(); if(!REDUCED) nav.classList.add('imm-in'); if(had) focusTo(nav.querySelector('.btn:not(.prev)')||nav.querySelector('.btn')); }
  });
  const go=k=>{
    if(k===cur) return;
    stopAudio();
    if(!nodes[k]){
      const node=chunkEl(chunks[k]); node.classList.add('in');
      const h=node.querySelector('h2');
      const pos=scen.indexOf(k);
      if(h && pos>=0 && scen.length>1) h.insertAdjacentHTML('afterbegin','<span class="sr-only">Interaction '+(pos+1)+' of '+scen.length+': </span>');
      nodes[k]=node;
    }
    slot.replaceChildren(nodes[k]);
    cur=k; far=Math.max(far,k);
    paintDots(); paintNav();
    if(INTERACTED){
      requestAnimationFrame(()=>{ window.scrollTo({top:0, behavior:REDUCED?'auto':'smooth'}); focusTo(nodes[k].querySelector('h2')); });
    }
  };
  go(0);
}

if(META.embed) embedStart(); else goPage(0);
</script>
</body>
</html>
