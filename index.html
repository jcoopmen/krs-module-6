<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Responder Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
html{font-size:clamp(16px,0.42vw + 13.4px,24px)}
@media (max-width:760px){html{font-size:17px}}
:root{
  --trust:#FDDA64; --tranquil:#B8D8EB; --team:#235B4E; --taupe:#847770; --muted:#424759;
  --header:#222222; --body:#424759; --bg:#F0F2F5; --border:#D8DEEB; --white:#fff;
  --convo:#F1F8FC; --convo-line:#D3E7F3; --alert:#C0392B; --alert-bg:#FBEDEB;
  --sans:"Roboto","Helvetica Neue",Arial,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --col:46rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth}
body{font-family:var(--serif);color:var(--body);background:var(--white);font-size:1.06rem;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.sans{font-family:var(--sans);color:var(--header);font-weight:500}
button{font:inherit}
:focus-visible{outline:2px solid var(--team);outline-offset:2px;border-radius:99px}
.skip{position:absolute;left:-9999px;background:var(--header);color:#fff;padding:10px 16px;z-index:200}
.skip:focus{left:0;top:0}

/* ---------- logo ---------- */
.lockup{display:flex;align-items:center;gap:.7rem}
.mark{background:var(--trust);color:var(--header);border-radius:50%;font-family:var(--sans);font-weight:700;display:grid;place-items:center;flex:0 0 auto;letter-spacing:-.02em}
.mark.lg{width:5rem;height:5rem;font-size:1.5rem}
.mark.md{width:2.5rem;height:2.5rem;font-size:.78rem}
.wordmark{font-family:var(--sans);font-weight:700;color:var(--header);line-height:1.12}
.wordmark.lg{font-size:1.5rem}
.wordmark.md{font-size:.8rem}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top .row{max-width:78rem;margin:0 auto;padding:.6rem 1.4rem;display:flex;align-items:center;gap:1rem}
.top .name{font-family:var(--sans);font-size:.82rem;color:var(--muted);letter-spacing:.02em;line-height:1.3}
.top .name b{display:block;color:var(--header);font-weight:500;font-size:.95rem}
.top .spacer{flex:1}
.menu{font-family:var(--sans);font-size:.85rem;background:none;border:1.5px solid var(--border);border-radius:99px;padding:.42rem 1rem;cursor:pointer;color:var(--header);display:flex;align-items:center;gap:.5rem}
.menu:hover{border-color:var(--trust)}
.menu .bars{display:inline-flex;flex-direction:column;gap:3px}
.menu .bars i{width:14px;height:2px;background:var(--header);border-radius:2px}
.track{height:3px;background:var(--bg)}
.fill{height:100%;width:0;background:var(--trust);transition:width .12s linear}

.drawer{position:fixed;inset:0;z-index:99;background:rgba(34,34,34,.35);opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s,visibility 0s .3s}
.drawer.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .25s}
.drawer .panel2{position:absolute;right:0;top:0;bottom:0;width:min(23rem,88vw);background:var(--white);padding:5rem 1.6rem 2rem;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.drawer.on .panel2{transform:none}
.drawer h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 .8rem}
.drawer a{display:block;font-family:var(--sans);font-size:.95rem;color:var(--body);text-decoration:none;padding:.6rem .8rem;border-radius:.7rem;line-height:1.35}
.drawer a:hover{background:var(--bg);color:var(--header)}
.drawer a .n{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- hero ---------- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:7rem 1.4rem 9rem;position:relative;overflow:hidden}
.hero .in{max-width:var(--col);margin:0 auto;width:100%;position:relative;z-index:1}
.hero .sweep{position:absolute;left:-10%;right:-10%;bottom:-6rem;height:18rem;background:var(--trust);border-radius:100% 100% 0 0 / 100% 100% 0 0}
.hero .circ{position:absolute;right:-3rem;bottom:0;width:15rem;height:15rem;border-radius:50%;background:var(--tranquil)}
.hero .lockup{margin-bottom:2.6rem}
.hero .kick{font-family:var(--sans);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .7rem}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin:0 0 .6rem;letter-spacing:-.5px}
.hero .sub{font-family:var(--sans);font-size:1.15rem;color:var(--header);margin:0 0 1.4rem}
.hero .meta{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin:0 0 2rem}
.scrollcue{display:inline-flex;align-items:center;gap:.7rem;background:var(--header);color:#fff;border:0;border-radius:99px;padding:.75rem 1.6rem;font-family:var(--serif);font-size:1rem;cursor:pointer}
.scrollcue:hover{transform:translateY(-1px)}

/* ---------- stream ---------- */
main{padding-bottom:6rem}
.col{max-width:var(--col);margin:0 auto;padding:0 1.4rem}
.blk{margin:0 auto;padding:2.2rem 0 0;scroll-margin-top:5rem}
/* A page opening with a divider clears the fixed bar on its own margin. A
   continuation page starts straight into a screen, so it needs the room. */
#stream[data-top="bare"]>.blk:first-child{padding-top:5.6rem}
.rev{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.rev.in{opacity:1;transform:none}
p{margin:0 0 1rem}
h2{font-size:1.9rem;line-height:1.2;margin:0 0 .9rem;letter-spacing:-.3px}
h3{font-size:1.15rem;margin:1.6rem 0 .6rem}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
strong{font-weight:600;color:var(--header)}
ul.brand,ol.brand{margin:0 0 1rem;padding:0;list-style:none}
ul.brand li{position:relative;padding-left:1.5rem;margin-bottom:.55rem}
ul.brand li::before{content:"";position:absolute;left:.15rem;top:.72em;width:.5rem;height:.5rem;border-radius:50%;background:var(--trust)}
ol.brand{counter-reset:b}
ul.brand.sub{margin:.55rem 0 0}
ul.brand.sub li{margin-bottom:.35rem}
ol.brand>li{position:relative;padding-left:2.6rem;margin-bottom:.8rem;counter-increment:b}
ol.brand>li::before{content:counter(b);position:absolute;left:0;top:0;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--trust);color:var(--header);font-family:var(--sans);font-weight:500;font-size:.85rem;display:grid;place-items:center}

.panel{background:var(--bg);border:1px solid var(--border);border-radius:1.2rem;padding:1.1rem 1.35rem;margin:0 0 1rem;position:relative;overflow:hidden}
.panel.blue{background:#EAF4FA;border-color:#CFE5F2}
.panel.blue::after{content:"";position:absolute;right:-2rem;top:-2.6rem;width:6rem;height:6rem;border-radius:50%;background:rgba(255,255,255,.55)}
.panel h4{margin:0 0 .35rem;font-size:1rem}
.panel p{margin:0;position:relative;z-index:1}
.note{font-style:italic;border-left:3px solid var(--taupe);padding:.15rem 0 .15rem 1rem;margin:0 0 1rem}
.note p{margin:0}
.keycall{border-left:.3rem solid var(--trust);background:var(--bg);border-radius:0 1rem 1rem 0;padding:1rem 1.3rem;margin:.4rem 0 1rem}
.keycall p{margin:0 0 .5rem;color:var(--header);font-family:var(--sans);font-size:1.02rem;line-height:1.5}
.keycall p:last-child{margin:0}

.cards{display:grid;gap:.7rem;margin:0 0 1rem}
.cards[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards[data-cols="5"]{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--bg);border:1px solid var(--border);border-radius:1.1rem;padding:.85rem .95rem;display:flex;gap:.7rem;align-items:flex-start;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--trust)}
/* The lift on hover moves the bottom edge away from the pointer; this keeps
   the hover area where it was so a card at the edge does not flicker. */
.card{position:relative}.card::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px}
.card span{font-size:.97rem;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.card .mk{flex:0 0 auto;font-family:var(--sans);font-size:.8rem;font-weight:500;color:var(--muted);padding-top:.12rem}
.card .mk.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--trust);margin-top:.6rem}
.cards.numbered .card{align-items:center}
.cards.tight .card{padding:.6rem .8rem}

.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:.4rem 0 1rem}
.flips[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.flip{perspective:1000px;min-height:15rem;display:grid}
.flip .inner{position:relative;width:100%;display:grid;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:15rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.2rem;padding:1.2rem 1.15rem;display:flex;flex-direction:column;justify-content:space-between;gap:.7rem;overflow:hidden}
.face .n{font-family:var(--sans);font-weight:500;font-size:1.2rem;color:var(--header);opacity:.45;line-height:1}
.face .t{font-family:var(--sans);font-weight:500;font-size:1.05rem;color:var(--header);line-height:1.3;margin-top:auto}
.face .hint{font-family:var(--sans);font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--header);opacity:.55;line-height:1.3}
.face.f{background:var(--trust)}
.face.b{background:var(--bg);border:1px solid var(--border);transform:rotateY(180deg)}
.face.b p{font-size:.95rem;line-height:1.55;margin:0 0 auto}
.face.b .hint{opacity:.75}
.flip .inner:hover .face.f{filter:brightness(1.03)}

.tabs{margin:0 0 1rem}
.tablist{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.tablist button{font-family:var(--sans);font-size:.85rem;border:1.5px solid var(--border);background:var(--white);color:var(--body);border-radius:99px;padding:.42rem 1rem;cursor:pointer}
.tablist button[aria-selected="true"]{background:var(--trust);border-color:var(--trust);color:var(--header);font-weight:500}
.tabpanel{background:var(--bg);border:1px solid var(--border);border-radius:1.2rem;padding:1.1rem 1.35rem}
.tabpanel h4{margin:0 0 .35rem;font-size:1rem}
.tabpanel p{margin:0}
.tabpanel p+p,.tabpanel p+ul,.tabpanel ul+p{margin-top:.6rem}
.tabpanel ul.brand{margin-bottom:0}
.tabpanel .audio{margin:.7rem 0 0}

.acc{border-top:1px solid var(--border);margin:0 0 1rem}
.acc-item{border-bottom:1px solid var(--border)}
.acc-item>button{width:100%;display:flex;gap:.8rem;align-items:center;background:none;border:0;cursor:pointer;padding:.85rem .2rem;text-align:left;font-family:var(--sans);font-size:1rem;color:var(--header);font-weight:500;line-height:1.35}
.acc-item>button .plus{margin-left:auto;flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--trust);display:grid;place-items:center;position:relative;transition:transform .25s}
.acc-item>button .plus::before,.acc-item>button .plus::after{content:"";position:absolute;background:var(--header);border-radius:2px}
.acc-item>button .plus::before{width:.62rem;height:2px}
.acc-item>button .plus::after{width:2px;height:.62rem;transition:opacity .2s}
.acc-item.on>button .plus{transform:rotate(180deg)}
.acc-item.on>button .plus::after{opacity:0}
.acc-body{display:none;padding:0 2.4rem .9rem .2rem}
.acc-item.on .acc-body{display:block}
.acc-body p{margin:0;font-size:.98rem}
.acc-body li{font-size:.98rem}
.acc-body p+ul,.acc-body p+ol,.acc-body p+p{margin-top:.6rem}
.acc-body>:last-child{margin-bottom:0}

.reveal-list{display:flex;flex-direction:column;gap:.5rem;margin:0 0 .8rem}
.rv{display:flex;gap:.7rem;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:1rem;padding:.7rem .95rem}
.rv .d{width:.5rem;height:.5rem;border-radius:50%;background:var(--trust);flex:0 0 auto;margin-top:.6rem}
.rv span{font-size:.97rem;line-height:1.5}
/* term-mode reveal: each term is a button that opens its explanation */
.rv.term{display:block;padding:0;transition:border-color .2s}
.rv.term:hover,.rv.term.on{border-color:var(--trust)}
.rv-btn{width:100%;display:flex;gap:.7rem;align-items:flex-start;background:none;border:0;padding:.75rem .95rem;text-align:left;cursor:pointer;font:inherit;color:var(--header);border-radius:1rem}
.rv-btn .rv-t{flex:1;min-width:0;font-family:var(--sans);font-weight:500;font-size:1rem;line-height:1.45}
.rv-btn .plus{flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--trust);position:relative;transition:transform .25s;margin-top:-.05rem}
.rv-btn .plus::before,.rv-btn .plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--header);border-radius:2px;transform:translate(-50%,-50%)}
.rv-btn .plus::before{width:.62rem;height:2px}
.rv-btn .plus::after{width:2px;height:.62rem;transition:opacity .2s}
.rv.term.on .plus{transform:rotate(180deg)}
.rv.term.on .plus::after{opacity:0}
.rv-d{display:none;padding:0 .95rem .85rem 2.15rem}
.rv.term.on .rv-d{display:block}
.rv-d p{margin:0;font-size:.97rem;line-height:1.55}
.rv-d p+p{margin-top:.5rem}
/* practice tip: the one place the course uses an icon (client request, Module 5) */
.tip{display:flex;gap:.95rem;align-items:flex-start;background:var(--white);border:1px solid var(--border);border-left:.3rem solid var(--trust);border-radius:.5rem 1.1rem 1.1rem .5rem;padding:1rem 1.2rem;margin:.4rem 0 1rem}
.tip .ico{flex:0 0 auto;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--trust);display:grid;place-items:center}
.tip .ico svg{width:1.35rem;height:1.35rem}
.tip .body{min-width:0}
.tip .body p{margin:0 0 .55rem}.tip .body>:last-child{margin-bottom:0}
.tip .body ul.brand{margin:.2rem 0 .55rem}
.tip .lbl{font-family:var(--sans);font-weight:500;color:var(--header)}
.video .frame.still{aspect-ratio:2/1}
.btn{font-family:var(--serif);font-size:1rem;border-radius:99px;padding:.6rem 1.5rem;border:1.5px solid transparent;cursor:pointer;background:var(--header);color:#fff}
.btn:hover{transform:translateY(-1px)}
.btn{position:relative}.btn::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px}
.btn.ghost{background:var(--white);color:var(--header);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--header);background:var(--white)}
.fb.no .btn.ghost{border-color:#E4B7B1}
.fb.no .btn.ghost:hover{border-color:var(--alert);color:var(--alert)}
.fb.no :focus-visible{outline-color:var(--alert)}
.btn.yellow{background:var(--trust);color:var(--header)}
.btn.small{font-size:.88rem;padding:.5rem 1.15rem}

/* ---------- section divider ---------- */
.divider{margin:4.5rem 0 1rem;padding:3.2rem 1.4rem;border-top:1px solid var(--border);border-bottom:.5rem solid var(--trust);background:var(--white);scroll-margin-top:4.5rem}
.divider[data-tone="tranquil"]{border-bottom-color:var(--tranquil)}
.divider .in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 9.5rem;gap:2rem;align-items:center}
.divider .num{font-family:var(--sans);font-weight:500;font-size:3.8rem;line-height:1;color:var(--trust);margin:0 0 .1rem}
.divider[data-tone="tranquil"] .num{color:var(--tranquil)}
.divider .rule{width:3.2rem;height:.32rem;border-radius:99px;background:var(--trust);margin:0 0 .9rem}
.divider[data-tone="tranquil"] .rule{background:var(--tranquil)}
.divider .kick{font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem}
.divider h2{font-size:2.3rem;margin:0 0 .6rem}
.divider .line{margin:0;max-width:40ch}
.divider .art{width:100%;height:auto}

/* ---------- table ---------- */
.tbl{margin:1rem 0;border:1px solid var(--border);border-radius:1.1rem;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:.75rem .9rem;font-size:.96rem;line-height:1.5;border-bottom:1px solid var(--border)}
.tbl tbody:empty{display:none}
.tbl thead th{font-family:var(--sans);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--bg)}
.tbl tbody th{font-family:var(--sans);font-weight:500;color:var(--header);font-size:1rem}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) th,.tbl tbody tr:nth-child(even) td{background:#FBFBFD}

/* ---------- knowledge check ---------- */
.check{background:#F7F8FB;border:1px solid var(--border);border-radius:1.4rem;padding:1.4rem 1.5rem;margin:1rem 0}
.check .hint{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.98rem;margin:-.4rem 0 .9rem}
.check .prompt{font-family:var(--sans);font-size:1.1rem;color:var(--header);font-weight:500;margin:0 0 .9rem;line-height:1.4}
.check .prompt.scenario{font-family:var(--serif);font-weight:400;color:var(--body);font-size:1.02rem;line-height:1.6;margin:0 0 .8rem}
.check .prompt.ask{margin:0 0 .9rem}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:1rem;padding:.75rem .9rem;cursor:pointer;color:var(--body);font-family:var(--serif);font-size:1rem;line-height:1.5;transition:border-color .18s,background .18s}
.opt:hover:not(:disabled){border-color:var(--trust)}
.opt:disabled{cursor:default}
.opt .key{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;background:#E6E9EF;color:var(--header);font-family:var(--sans);font-size:.82rem;font-weight:500;display:grid;place-items:center;margin-top:.05rem}
.opt[data-picked="1"]{border-color:var(--header)}
.opt[data-picked="1"] .key{background:var(--header);color:#fff}
.opt[data-outcome="correct"]{border-color:var(--team);border-width:2px;background:#EAF3EF}
.opt[data-outcome="correct"] .key{background:var(--team);color:#fff}
.opt[data-outcome="wrong"]{border-color:var(--alert);border-width:2px;background:var(--alert-bg)}
.opt[data-outcome="wrong"] .key{background:var(--alert);color:#fff}
.opt[data-outcome="info"]{border-color:var(--tranquil)}
.opt[data-outcome="info"] .key{background:var(--tranquil)}
.opt[data-outcome="dim"]{opacity:.8}
.fb{border-radius:1rem;padding:.85rem 1.1rem;margin-top:.8rem;font-size:1rem}
.fb p{margin:0}
.fb p+p{margin-top:.7rem}
.fb .thread{margin:.7rem 0 0}
.fb .thread+p{margin-top:.7rem}
.fb .note{margin:.8rem 0 0}
.fb .audio{margin:.7rem 0}
.fb.yes{background:#E4EFEA;border-left:.3rem solid var(--team);color:#1D4A40}
.fb.no{background:var(--alert-bg);border-left:.3rem solid var(--alert)}
.fb.info{background:#EAF4FA;border-left:.3rem solid #7FB4D4}
.fb .cards{margin:.7rem 0 0}
.fb .card{background:var(--white);border-color:#CFE5F2} .fb.info .head{color:#2C6C90}

/* ---------- transcripts ---------- */
.vig{border:1px solid var(--border);border-radius:1.4rem;padding:1.3rem 1.4rem;margin:1rem 0 0}
.vig-head{display:flex;align-items:center;gap:.8rem;margin:0 0 1rem;flex-wrap:wrap}
.avatar{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--tranquil);display:grid;place-items:center;font-family:var(--sans);font-weight:500;color:var(--header)}
.vig-head .nm{font-family:var(--sans);font-size:1.1rem;color:var(--header);font-weight:500;display:block;line-height:1.2}
.vig-head .sub{font-family:var(--sans);font-size:.78rem;color:var(--muted)}
.chip{font-family:var(--sans);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:.35rem .8rem;border-radius:99px;background:var(--trust);color:var(--header)}
.chip.blue{background:var(--tranquil)}
.thread{background:var(--convo);border:1px solid var(--convo-line);border-radius:1.1rem;padding:1rem 1.15rem;margin:0 0 1rem}
.thread .ch{font-family:var(--sans);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 .7rem}
.line{margin:0 0 .7rem}
.line:last-child{margin-bottom:0}
.line .spk{font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--header);display:block;margin-bottom:.15rem}
.line .meta{font-style:italic;color:var(--muted)}
.bubble{max-width:88%;padding:.65rem .9rem;border-radius:1.1rem;margin:0 0 .45rem;font-size:1rem;line-height:1.55;position:relative;z-index:1}
.bubble.them{background:var(--white);border:1px solid var(--convo-line);border-bottom-left-radius:.35rem}
.bubble.us{background:var(--tranquil);border-bottom-right-radius:.35rem;margin-left:auto;color:var(--header)}
.bubble .spk{font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.2rem}
.sysline{font-style:italic;color:var(--muted);font-size:.95rem;margin:.2rem 0 .7rem;text-align:center}
.bubble .bh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.2rem}
.bubble .bh .spk{margin-bottom:0}
.bubble .ts{font-family:var(--sans);font-size:.72rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* checklist */
.checklist{display:grid;gap:.5rem;margin:.4rem 0 1.1rem}
.ck{display:flex;gap:.8rem;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:1rem;padding:.75rem .95rem;cursor:pointer;transition:border-color .2s,background .2s}
.ck input{position:absolute;opacity:0;width:1px;height:1px}
.ck .box{flex:0 0 1.35rem;height:1.35rem;border:2px solid var(--taupe);border-radius:.4rem;background:var(--white);margin-top:.15rem;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck .box::after{content:"";width:.38rem;height:.7rem;border:solid var(--white);border-width:0 .16rem .16rem 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}

.ck input:focus-visible + .box{outline:3px solid var(--trust);outline-offset:2px}
.ck.on{background:#E4EFEA;border-color:#B9D3C9}

.carousel{margin:.4rem 0 1.1rem}

.car-slide.on{visibility:visible;opacity:1}
.car-slide h4{font-family:var(--sans);font-weight:500;font-size:1.02rem;color:var(--header);margin:0 0 .5rem}
.car-slide p{margin:0 0 .6rem}.car-slide>:last-child{margin-bottom:0}
.car-slide p.car-quote{font-size:1.08rem;line-height:1.6;border-left:.3rem solid var(--trust);padding-left:1rem}
.car-nav{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:.7rem}
.car-nav .count{font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.car-dots{display:flex;gap:0;justify-content:center;flex:1}
/* Each dot is a 24px target (WCAG 2.5.8) with the small dot drawn inside it. */
.car-dots button{width:1.5rem;height:1.5rem;min-width:24px;min-height:24px;border-radius:50%;border:0;background:none;padding:0;cursor:pointer;position:relative}
.car-dots button::before{content:"";position:absolute;left:50%;top:50%;width:.62rem;height:.62rem;border-radius:50%;background:var(--border);transform:translate(-50%,-50%)}
.car-dots button[aria-current="true"]::before{background:var(--team)}
.car-nav .btn[disabled]{opacity:.4;cursor:default}
/* An annotation hangs off the message it belongs to: same yellow as the

   rather than as the next one in the thread. */
.ann{display:none;max-width:88%;margin:-.55rem 0 .9rem auto;padding:.9rem .95rem .6rem;background:#FFF3C4;border:1px solid var(--trust);border-top:0;border-radius:0 0 .9rem .9rem;font-size:.95rem;line-height:1.5;color:var(--header);position:relative;z-index:0}
.ann .spk{color:#6B5A1E}
/* An annotation on a stage direction sits centred under it, with a full border. */
.ann.sys{margin:-.3rem auto .9rem;border-top:1px solid var(--trust);border-radius:.9rem}
.ann.on{display:block}
.col p.instr{margin:-.3rem 0 .9rem}

mark{background:var(--trust);color:var(--header);padding:.05em .25em;border-radius:.3em;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:2px solid rgba(34,34,34,.35);transition:background .15s}
mark:hover{filter:brightness(.95)}
mark.on{background:var(--header);color:var(--white);border-bottom-color:var(--header)}
mark:focus-visible{outline:2px solid var(--header);outline-offset:2px}
.ann .spk{font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.2rem}
.col p a,.col li a,.col .note a{color:var(--header);text-decoration:underline;text-underline-offset:.15em}
.typing{display:inline-flex;gap:5px;padding:.7rem .9rem;background:var(--white);border:1px solid var(--convo-line);border-radius:1.1rem}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--taupe);opacity:.5;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
.step{font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:.6rem;margin:1.4rem 0 .6rem}
.step .n{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--trust);color:var(--header);display:grid;place-items:center;font-size:.75rem;letter-spacing:0}
.locked{opacity:.45;pointer-events:none}
/* The learner's own draft set beside the strongest option, once a response

.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:0 0 .9rem}
.compare .side{background:var(--white);border:1px solid var(--convo-line);border-radius:1rem;padding:.75rem .9rem}
.compare .side.best{border-color:var(--trust);border-width:2px;background:#FFFBEF}
.compare .lbl{display:block;font-family:var(--sans);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:.35rem}
.compare p{margin:0;font-size:.97rem;line-height:1.55;color:var(--body);white-space:pre-wrap}
.compare p.none{font-style:italic;color:var(--muted)}
.writestep textarea{margin-top:.2rem}
/* Immersive scenario: one stage at a time, finished stages in a trail above. */
.imm-trail{display:grid;gap:.6rem;margin:0 0 .3rem}
.imm-trail:empty{display:none}
.imm-trail .audio{margin:0}
.imm-trail .thread{margin:0}
.imm-done{background:var(--bg);border:1px solid var(--border);border-radius:1rem;padding:.65rem .95rem;font-size:.95rem;line-height:1.5}
.imm-done .lbl,.imm-said .lbl{display:block;font-family:var(--sans);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:.2rem}
.imm-stage{scroll-margin-top:5.5rem;padding-top:.4rem}
.imm-trail:not(:empty)+.imm-stage{border-top:1px solid var(--border);margin-top:1rem;padding-top:.6rem}
.imm-stage .col-instr,.imm-stage p.instr{font-style:italic;color:var(--body);margin:.3rem 0 .8rem}
.imm-said{background:var(--tranquil);color:var(--header);border-radius:1.1rem;border-bottom-right-radius:.35rem;padding:.75rem 1rem;margin:0 0 1rem auto;max-width:88%;line-height:1.55}
.imm-next{margin:.9rem 0 .2rem;display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.imm-in{animation:immIn .45s ease both}
@keyframes immIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt .tried{margin-left:auto;flex:0 0 auto;font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:.3rem 0 0 .6rem}
.thread .typing.pending{margin:0 0 .45rem}
.audio.big .bar{padding:1rem 1.2rem;gap:1.1rem}
.audio.big .play{width:3.4rem;height:3.4rem}
.audio.big .play::after{border-left-width:.95rem;border-top-width:.6rem;border-bottom-width:.6rem}
.audio.big .play.pause::after{border:0;border-left:.28rem solid var(--header);border-right:.28rem solid var(--header);width:.95rem;height:1.05rem;left:50%}
.audio.big .ttl{font-size:1rem}
.audio.big .wave{height:2.4rem}
.gate{max-width:var(--col);margin:2.6rem auto 1rem;padding:1.4rem 1.4rem 0;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center}
.gate .btn{max-width:100%}
.gate[hidden]{display:none}
.gate .back{background:none;border:0;color:var(--muted);font-family:var(--sans);font-size:.85rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.gate .back:hover{color:var(--header)}
.drawer a[aria-current="true"]{background:var(--bg);color:var(--header);font-weight:500}
.drawer a .tick{float:right;color:var(--trust)}

/* ---------- video / reflection / refs / end ---------- */
.video .frame{position:relative;aspect-ratio:16/9;border-radius:1.3rem;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;margin:0 0 1rem}
.video .play{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--trust);position:relative}
.video .play::after{content:"";position:absolute;left:53%;top:50%;transform:translate(-50%,-50%);border-left:1.05rem solid var(--header);border-top:.65rem solid transparent;border-bottom:.65rem solid transparent}
.video .lbl{font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.reflect label{display:block;font-family:var(--sans);font-size:1rem;color:var(--header);font-weight:500;margin:0 0 .45rem;line-height:1.4}
.field{margin-bottom:1rem}
textarea{width:100%;min-height:5rem;border:1.5px solid var(--border);border-radius:1rem;padding:.8rem .9rem;font-family:var(--serif);font-size:1rem;color:var(--body);line-height:1.55;resize:vertical;background:var(--white)}

.refs p{font-size:.9rem;line-height:1.5;margin:0 0 .6rem;padding-left:1.4rem;text-indent:-1.4rem}
.end{margin-top:4rem;padding:4rem 1.4rem 5rem;position:relative;overflow:hidden;border-top:1px solid var(--border)}
.end .in{max-width:var(--col);margin:0 auto;position:relative;z-index:1}
.end .sweep{position:absolute;left:-10%;right:-10%;bottom:-7rem;height:14rem;background:var(--trust);border-radius:100% 100% 0 0 / 100% 100% 0 0}

.foot{padding:1.2rem 1.4rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.8rem;justify-content:center;font-family:var(--sans);font-size:.78rem;color:var(--muted)}

<script>
/* =====================================================================
   9-8-8 e-learning prototype — MODULE CONTENT
   Key Responder Skills · Module 6: Working with Emotion and Validation

   This file holds content only. All styling and interaction behaviour

/* ---------------- TOPIC 1 ---------------- */
{sec:1, type:'section', num:'01', kicker:'Topic 1', art:'a',
 title:`Reflecting emotions`, line:`How to choose words that fit the person's feelings and adjust your reflection when they confirm, correct or add to your understanding`},

{sec:1, type:'prose', blocks:[
  {p:`In Module 5, you practised paraphrasing what a person has told you and reflecting meaning by connecting a feeling with the situation that gives rise to it. This topic focuses more closely on identifying and naming the feeling itself.`, lede:true},
  {p:`Reflecting emotions means:`},
  {ol:[
    `putting into words what you understand a caller or texter to be feeling`,
    `then checking whether your understanding fits their experience.`
  ]},
  {p:`The ability to reflect emotions will not only help ensure that callers and texters feel better understood; it will also prepare you for validation, since acknowledging a person's feelings begins with accurately understanding their narrative.`},
  {p:`Sometimes a caller or texter may name a feeling directly. Other times, you may recognize it through their tone of voice, their choice of words, or what they leave unsaid. At 9-8-8, we treat responding to either of these situations as part of the same skill.`},
  {panel:{cls:'blue', p:`<strong>Remember:</strong> In Module 2, you learned that a caller or texter's sense of being understood is closely linked to how helpful they find an interaction. Reflecting emotions is another tool you can use to achieve this goal.`}}
]},

{sec:1, type:'prose', title:'Offering a reflection tentatively', blocks:[
  {p:`Even when a feeling seems clear, the person may experience it differently from how you perceive it. This is why it is important to offer your reflection tentatively.`, lede:true},
  {p:`A <strong>tentative reflection</strong> offers your understanding of a person's feelings in a way that invites them to confirm, correct or expand on it. Your wording should leave room for the person to describe their experience differently.`},
  {p:`To offer a reflection tentatively, you can introduce it with phrases such as:`},
  {ul:[
    `"It sounds like..."`,
    `"I'm sensing..."`,
    `"I get the impression that..."`,
    `"From what you're telling me..."`,
    `"From the sound of your voice..."`
  ]}
]},

/* Continues "Offering a reflection tentatively". */
{sec:1, type:'prose', blocks:[
  {p:`Then check whether the reflection fits:`, lede:true},
  {ul:[
    `"Am I getting that right?"`,
    `"Is that close?"`,
    `"Or is it something else?"`
  ]},
  {panel:{cls:'blue', p:`Be sure to give the person time to respond, and use what they tell you to guide your next response. Their answer may confirm your understanding, or help you recognize a feeling you had missed.`}}
]},

{sec:1, type:'prose', title:'Practice example', blocks:[
  {p:`Consider the following example based on a real 9-8-8 text interaction to see what a tentative reflection looks like in practice:`, lede:true},
  {thread:{ch:'Text', lines:[
    {who:'us', spk:'Responder', t:`Welcome to 9-8-8: Suicide Crisis Helpline. What has you reaching out today?`},
    {who:'them', spk:'Texter', t:`hi. i dont really know how to say this`},
    {who:'them', spk:'Texter', t:`i just feel like ive lost myself. like for a long time now. i want to feel better but i dont know where to start`},
    {who:'us', spk:'Responder', t:`I'm glad you reached out tonight. When you say you've lost yourself, what does that mean for you?`},
    {who:'them', spk:'Texter', t:`its like im not really in my body half the time. i watch myself go to class and talk to people but its not me doing it`},
    {who:'them', spk:'Texter', t:`it started a while ago. i cant explain it properly, sorry`},
    {who:'us', spk:'Responder', t:`That sounds really scary and disorienting to experience. Am I getting that feeling right?`},
    {who:'them', spk:'Texter', t:`yeah. scary is right`},
    {who:'them', spk:'Texter', t:`nobody gets it when i try to explain. they think i mean tired or spaced out`},
    {who:'them', spk:'Texter', t:`its worse at night. like i dont know who im going to be when i wake up`},
    {who:'us', spk:'Responder', t:`So it's frightening in itself, and it's lonely too, when people hear "tired" and you mean something much bigger than that. Is that part of it?`},
    {who:'them', spk:'Texter', t:`yes. thats exactly it. i havent said that part to anyone`}
  ]}},
  {p:`As you can see from this example, naming the possible feelings and checking them gave the texter an opportunity to say whether the response fit their experience, which in turn helped them feel better understood.`}
]},

{sec:1, type:'prose', title:'Adjusting when the person responds', blocks:[
  {p:`Once you have offered a reflection, the person's response helps you decide whether to continue exploring a feeling or revise your understanding:`, lede:true},
  {instr:`Select each response to learn more.`},
  {reveal:{items:[
    {t:`If they confirm your reflection`, blocks:[
      {p:`Give them room to continue. You might pause or invite them to say more about what contributes to the feeling.`},
      {p:`Example: "What's been making you feel so alone?"`}
    ]},
    {t:`If they correct your reflection`, blocks:[
      {p:`Acknowledge the correction and use their words. Let their description replace your initial interpretation.`},
      {p:`Example: "Resentful, okay. Thanks for correcting me. What's been building that resentment?"`}
    ]},
    {t:`If they expand on your reflection`, blocks:[
      {p:`Acknowledge what they have added and reflect the fuller picture, including anything you missed.`},
      {p:`Example: "So you're feeling lonely, and also afraid that if you reach out, you'll be rejected. Am I understanding that correctly?"`}
    ]}
  ]}}
]},

/* Continues "Adjusting when the person responds". */
{sec:1, type:'prose', blocks:[
  {p:`When it comes to reflection, members of the 9-8-8 Lived Experience Advisory Team have identified a particularly harmful responder error: summarizing someone's feelings incorrectly and insisting on that summary when challenged.`, lede:true},
  {tip:{p:`If you miss the mark on a reflection, accepting a correction and adjusting your response shows that you are listening and willing to understand the experience on the caller or texter's terms.`}}
]},

{sec:1, type:'prose', title:'Emotion vocabulary', blocks:[
  {p:`Accurate emotion reflection depends on having the right words at your disposal. New responders often rely on a few familiar words such as sad, angry, stressed, frustrated and overwhelmed.`, lede:true},
  {p:`These words are rarely wrong, but they are often too broad to show the caller or texter that you have understood their particular experience. Developing a wider <strong>emotion vocabulary</strong> helps you offer a reflection that fits the person's particular experience.`}
]},

{sec:1, type:'prose', title:'Surface and underlying feelings', blocks:[
  {p:`In other 9-8-8 training, you may have practised distinguishing two kinds of feelings:`, lede:true},
  {tabs:[
    {label:`Surface feelings`, p:`<strong>Surface feelings:</strong> Feelings that are readily apparent from the person's words or tone, such as anger.`},
    {label:`Underlying feelings`, p:`<strong>Underlying feelings:</strong> Feelings that the person has not directly expressed but that you think may be part of their experience. Someone expressing anger may also feel hurt, afraid or ashamed.`}
  ]},
  {panel:{cls:'blue', p:`Underlying feelings require particular care because you are inferring them. In these cases, offer your understanding tentatively and check it with the person. That said, there are also times where a surface feeling is sufficient: anger may be the feeling that best describes their experience; there may be no need to look beyond it.`}}
]},

{sec:1, type:'prose', title:'Finding a more accurate word', blocks:[
  {p:`In other 9-8-8 responder training, we use the emotion wheel as a tool to help you identify possible words to use to describe feelings. The words in the outer circles of the wheel can provide a more accurate description of what a caller or texter is experiencing, and may help you as a responder describe their underlying feelings:`, lede:true},
  {image:{label:`Emotion wheel`}},
  {note:`"Fine" may need further clarification before interpretation. Depending on the person, it might mean they feel okay, but it might also mean that they are trying to hold things together or feel numb, resigned or worn out. You should ask what they mean before offering a more specific word.`}
]},

{sec:1, type:'prose', title:'How to choose words that fit', blocks:[
  {p:`Accurately reflecting emotions does not mean you have to use impressive words or keep a thesaurus on your desk. It simply means choosing a word the person would recognize as their own.`, lede:true},
  {p:`There are three practices that can help you make your reflections more precise:`},
  {instr:`Select each practice to learn more.`},
  {reveal:{items:[
    {t:`Use the person's own words`, d:`If a caller says they feel "useless," you might say, "Okay, so you're feeling useless right now." This acknowledges their feeling without agreeing with that judgement of themselves.`},
    {t:`Match the intensity they describe`, d:`"Devastated" may overstate "a bit down," while "a bit down" may understate "heartbroken." Be sure to attend to both their words and how they express them, and check when you are unsure.`},
    {t:`Stay close to their experience`, d:`Use familiar language that fits what they have shared. Offer the word tentatively and adjust it if they describe the feeling differently.`}
  ]}}
]},

{sec:2, type:'section', kicker:'Activity', art:'b', tone:'tranquil',
 title:`Emotion vocabulary builder`, line:`Choose the word that best fits what a caller or texter has said in three short excerpts.`},

{sec:2, type:'prose', title:'How this activity works', blocks:[
  {p:`In this activity, you will practise choosing a more precise word for what a caller or texter may be feeling.`, lede:true},
  {p:`For each of three short excerpts, you will:`},
  {ul:[
    `listen to or read what the caller or texter says`,
    `select the word or phrase that best fits what the person has communicated`,
    `review the feedback for each option`
  ]},
  {note:`Your answers are not scored. More than one word can fit a person's experience. Choose the one that stays closest to their words and tone.`}
]},

/* The briefing asks the learner to review the feedback for each option, so
   the other options stay open after the best one (`explore`). */
{sec:3, type:'mcq', title:'Excerpt 1', explore:true, exploreLabel:`Try another option`,
 intro:[
  {audio:{label:`Excerpt 1`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(quiet, slow)`, t:`I keep setting a place for him at the table. Six months, and I still do it. Then I just stand there and look at it.`}
  ]}}
 ],
 prompt:`Which word most closely describes what this caller may be feeling?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Sad`, correct:false,
   fb:`Sad is a reasonable starting point, but it describes a broad feeling. The caller gives you something more specific: a familiar routine that brings the loss into focus again. A word that acknowledges that loss would convey more of what you have heard.`},
  {k:'B', t:`Lonely`, correct:false,
   fb:`The empty place at the table may suggest loneliness. However, the strongest clue is the caller's repeated experience of setting a place for someone who is no longer there. Loneliness could be part of that experience, but you would need to check.`},
  {k:'C', t:`Grieving`, correct:true,
   fb:`Grieving most closely captures the caller's continuing experience of loss and its presence in an everyday routine. You might offer, "It sounds like setting the table brings that loss back to you. Is that close?"`}
 ]},

{sec:3, type:'mcq', title:'Excerpt 2', explore:true, exploreLabel:`Try another option`,
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`my manager read out my mistake in the team meeting. in front of everyone. i just sat there. i havent been able to look at anyone since`}
  ]}}
 ],
 prompt:`Which word most closely describes what this texter may be feeling?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Angry`, correct:false,
   fb:`The texter may feel angry about how their manager treated them. Staying silent does not necessarily rule out anger. However, their emphasis on "in front of everyone" and difficulty facing colleagues gives you stronger support for a reflection about feeling humiliated.`},
  {k:'B', t:`Humiliated`, correct:true,
   fb:`Humiliated fits the texter's emphasis on having their mistake exposed publicly and finding it difficult to face others afterwards. You could check by saying, "It sounds like being singled out in front of everyone felt humiliating. Am I getting that right?"`},
  {k:'C', t:`Anxious`, correct:false,
   fb:`Anxiety could be part of the texter's difficulty facing colleagues. But the message places particular emphasis on the public exposure of their mistake, so humiliated is the closer starting point. Their response to your reflection would help you understand whether anxiety is also present.`}
 ]},

{sec:3, type:'mcq', title:'Excerpt 3', explore:true, exploreLabel:`Try another option`,
 intro:[
  {audio:{label:`Excerpt 3`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(fast, then flatter)`, t:`I've called three places today. Every one of them gave me another number to call. Can you believe that? I'm just... done. I'm not calling anyone else.`}
  ]}}
 ],
 prompt:`Which word most closely describes what this caller may be feeling?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Defeated`, correct:true,
   fb:`Defeated captures the caller's repeated efforts to get help and their sense of being unable or unwilling to keep trying. "I'm just... done," together with the change in delivery, supports this interpretation. You would still need to check whether the word fits.`},
  {k:'B', t:`Frustrated`, correct:false,
   fb:`Frustrated fits the repeated redirections and the emphasis on "three." Defeated also acknowledges the shift towards giving up on further calls. Both feelings may be present, and the caller can help you understand which is closer.`},
  {k:'C', t:`Furious`, correct:false,
   fb:`Furious suggests intense anger, which this excerpt does not clearly establish. A flat voice does not rule out anger, but the caller's words give you more support for reflecting discouragement after repeated attempts to get help.`}
 ]},
